:root{
--ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
--display:"Fredoka","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
.scenebg{position:fixed;inset:0;overflow:hidden}
.scenebg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenebg.baking *{animation:none!important}

,dir:2,cells:[[6,11],[6,12]]},{id:33,kind:"plain",dir:2,cells:[[0,11],[0,12]]}]}],window.UnwindI18n=function(){var e={Unwind:"Unwind","The Poem":"O Poema",Matchday:"Dia de Jogo",Woodland:"Bosque","Kick the ball into the goal on the right. The goal on the left is your own.":"Chuta a bola para a baliza da direita. A baliza da esquerda é a tua.","Red cards that run out stay on the pitch for good. Clear the way in time.":"Os cartões vermelhos que acabam ficam em campo para sempre. Abre caminho a tempo.","Five boards. Sometimes the way forward starts by going back.":"Cinco tabuleiros. Às vezes, para avançar, é preciso recuar primeiro.","Push the bird onto the slingshot, then throw it at the wooden wall.":"Empurra o pássaro para a fisga e depois atira-o contra a parede de madeira.","A thrown bird now breaks the first arrow it hits. Birds can slide to other boards.":"Agora um pássaro atirado parte a primeira seta em que acertar. Os pássaros podem deslizar para outros tabuleiros.","Three boards and two birds. One wall is in the way of the slingshot itself.":"Três tabuleiros e dois pássaros. Há uma parede no caminho da própria fisga.","Push the letters into their slots to write a line of the poem.":"Empurra as letras para os seus espaços para escrever um verso do poema.","Solo levels on several boards at once. You play every board, and twin-shared and sniper arrows link them.":"Níveis a solo em vários tabuleiros ao mesmo tempo. Jogas em todos, e as setas gémeas partilhadas e atiradoras ligam-nos.","A football and a row of boards. An arrow that hits the ball kicks it. Score in the goal on the right; the left one is your own. Basic and red card arrows only, and red cards that run out stay for good.":"Uma bola e uma fila de tabuleiros. Uma seta que acerta na bola chuta-a. Marca na baliza da direita; a da esquerda é a tua. Só setas normais e de cartão vermelho, e os cartões vermelhos que acabam ficam para sempre.","Push birds onto the slingshot with arrows, then throw them to break wooden walls. From level 2, a thrown bird also breaks the first arrow it hits. Clear every arrow to win.":"Empurra pássaros para a fisga com setas e depois atira-os para partir paredes de madeira. A partir do nível 2, um pássaro atirado também parte a primeira seta em que acertar. Tira todas as setas para ganhar.","One level, one board for each line. Compass arrows push the letters sideways, and letters with nothing under them fall. Fill every slot to write the line, and read the whole poem at the end.":"Um nível, um tabuleiro por verso. As setas bússola empurram as letras para o lado, e as letras sem nada por baixo caem. Preenche todos os espaços para escrever o verso, e lê o poema inteiro no fim.","This line is written.":"Este verso está escrito.","Line 2 of 4: fill every slot to write it.":"Verso 2 de 4: preenche todos os espaços para o escrever.","Line 3 of 4: fill every slot to write it.":"Verso 3 de 4: preenche todos os espaços para o escrever.","Line 4 of 4: fill every slot to write it.":"Verso 4 de 4: preenche todos os espaços para o escrever.","Letters only move sideways.":"As letras só se mexem para os lados.","Something is in the way: it cannot move there.":"Há algo no caminho: não se pode mexer para ali.","Own goal! That costs a life. The ball goes back to the centre spot.":"Autogolo! Custa uma vida. A bola volta ao centro.","Out! That costs a life. The ball goes back to the centre spot.":"Fora! Custa uma vida. A bola volta ao centro.","The bird flew away.":"O pássaro voou para longe.","The bird is on the slingshot. Tap the slingshot to throw it.":"O pássaro está na fisga. Toca na fisga para o atirar.","Push a bird onto the slingshot with an arrow.":"Empurra um pássaro para a fisga com uma seta.","Choose where to throw the bird.":"Escolhe para onde atirar o pássaro.","Something is right in front of it.":"Há algo mesmo à frente.","No moves left: these letters cannot reach their slots any more.":"Sem jogadas: estas letras já não chegam aos seus espaços.","No moves left: the ball can no longer reach the goal.":"Sem jogadas: a bola já não consegue chegar à baliza.","No moves left: some arrows can never leave now.":"Sem jogadas: há setas que já nunca vão poder sair.","A wooden wall is in the way. A bird thrown from the slingshot can break it.":"Há uma parede de madeira no caminho. Um pássaro atirado da fisga consegue parti-la.","Your goal":"A tua baliza","Score here":"Marca aqui","GOAL!":"GOLO!",Continue:"Continuar","No moves left":"Sem jogadas","The ball can no longer reach the goal from here. Try a different order.":"Daqui a bola já não chega à baliza. Experimenta outra ordem.","These letters can no longer reach their slots. Try a different order.":"Estas letras já não chegam aos seus espaços. Experimenta outra ordem.","Some arrows can never leave now. Try a different order.":"Há setas que já nunca vão poder sair. Experimenta outra ordem.","Read the poem again":"Ler o poema outra vez","The whole poem, with its music.":"O poema inteiro, com a sua música.","Boarding Up specials":"Especiais de Tabuleiros em Grupo","Matchday: the ball":"Dia de Jogo: a bola","Woodland: birds and the slingshot":"Bosque: pássaros e a fisga","Birds that break arrows":"Pássaros que partem setas","The Poem: letters and slots":"O Poema: letras e espaços","An arrow that hits the ball kicks it and stays put. The ball rolls until something stops it, even across boards. Score on the right; the left goal is yours. Goalkeepers never move, and run-out red cards stay for good.":"Uma seta que acerta na bola chuta-a e fica onde está. A bola rola até algo a parar, mesmo entre tabuleiros. Marca à direita; a baliza da esquerda é a tua. Os guarda-redes nunca se mexem, e os cartões vermelhos que acabam ficam para sempre.","Arrows push birds, which slide until something stops them, even onto other boards. A bird that slides onto the slingshot sits on it: tap the slingshot, then a direction, to throw it. It breaks the first wooden wall it meets.":"As setas empurram pássaros, que deslizam até algo os parar, mesmo para outros tabuleiros. Um pássaro que desliza para a fisga fica lá: toca na fisga e depois numa direção para o atirar. Parte a primeira parede de madeira que encontrar.","From Woodland 2 on, a thrown bird also breaks the first arrow it hits, then drops on the tile before it. It is not a launch.":"A partir do Bosque 2, um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Não conta como lançamento.","Fill every slot with its letter to write a line. Letters fall when nothing holds them up, and a compass arrow that hits a letter pushes it one tile sideways.":"Preenche cada espaço com a sua letra para escrever um verso. As letras caem quando nada as segura, e uma seta bússola que acerta numa letra empurra-a uma casa para o lado.","Slingshot and birds":"Fisga e pássaros","Birds break arrows":"Os pássaros partem setas","An arrow that hits the ball kicks it and stays. The ball rolls until something stops it, even onto the next board. Score in the goal on the RIGHT: the left one is yours, and an own goal or a ball off the pitch costs a life. Goalkeepers never move, and red cards that run out stay for good.":"Uma seta que acerta na bola chuta-a e fica. A bola rola até algo a parar, mesmo para o tabuleiro seguinte. Marca na baliza da DIREITA: a da esquerda é a tua, e um autogolo ou uma bola fora custa uma vida. Os guarda-redes nunca se mexem, e os cartões vermelhos que acabam ficam para sempre.","An arrow that hits a bird pushes it, and it slides until something stops it. A bird that slides onto the slingshot sits on it. Tap the slingshot, then a direction, to throw the bird. It breaks the first wooden wall it meets. Clear every arrow to win.":"Uma seta que acerta num pássaro empurra-o, e ele desliza até algo o parar. Um pássaro que desliza para a fisga fica lá. Toca na fisga e depois numa direção para atirar o pássaro. Parte a primeira parede de madeira que encontrar. Tira todas as setas para ganhar.","From Woodland 2 on, a thrown bird also breaks the first arrow it hits, then drops on the tile before it. Breaking an arrow is not a launch. Use it to free arrows that block each other.":"A partir do Bosque 2, um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Partir uma seta não conta como lançamento. Usa isto para soltar setas que se bloqueiam uma à outra.","Fill every slot with its letter to write a line. Letters with nothing under them fall. A compass arrow that hits a letter pushes it one tile sideways and stays. Compass arrows still turn each time an arrow leaves. Finish a board to read the line, then the next board opens.":"Preenche cada espaço com a sua letra para escrever um verso. As letras sem nada por baixo caem. Uma seta bússola que acerta numa letra empurra-a uma casa para o lado e fica. As setas bússola continuam a rodar sempre que sai uma seta. Acaba um tabuleiro para ler o verso, e abre-se o seguinte.","Clear the ball's way first":"Primeiro abre caminho à bola","An arrow that hits the ball kicks it":"Uma seta que acerta na bola chuta-a","Goal! Always score on the right":"Golo! Marca sempre à direita","An arrow pushes the bird onto the slingshot":"Uma seta empurra o pássaro para a fisga","Tap the slingshot to aim":"Toca na fisga para apontar","The bird breaks the wooden wall":"O pássaro parte a parede de madeira","Arrows push birds out of the way":"As setas empurram os pássaros para fora do caminho","Now the arrow can leave":"Agora a seta pode sair","These two arrows block each other":"Estas duas setas bloqueiam-se uma à outra","Aim the slingshot at one of them":"Aponta a fisga a uma delas","The bird breaks the arrow it hits":"O pássaro parte a seta em que acerta","Now the other one can leave":"Agora a outra pode sair","An arrow leaves, so the letter falls into its slot":"Sai uma seta, por isso a letra cai no seu espaço","A compass arrow pushes a letter one tile sideways":"Uma seta bússola empurra uma letra uma casa para o lado","Fill every slot to write the line":"Preenche todos os espaços para escrever o verso",Calm:"Calmo",Hard:"Difícil",Timed:"Cronometrado",Seasons:"Estações",Winter:"Inverno",Spring:"Primavera",Summer:"Verão",Autumn:"Outono",Dawn:"Amanhecer",Morning:"Manhã",Noon:"Meio-dia",Dusk:"Anoitecer",Night:"Noite",Default:"Automático",Background:"Fundo","Change it any time. Your board stays as it is.":"Muda quando quiseres. O teu tabuleiro fica como está.",Harder:"Mais difícil","Open Water":"Águas Abertas","Growing the map":"A criar o mapa","Planting arrows":"A plantar setas","Choosing the best layout":"A escolher o melhor tabuleiro","Painting the board":"A pintar o tabuleiro","Almost ready":"Quase pronto","Today's puzzle":"Puzzle de hoje","No lives to lose out here.":"Aqui não há vidas a perder.","Hard boards: two lives, no hints, and combo arrows that mix up to 3 effects.":"Tabuleiros difíceis: duas vidas, sem dicas e setas combo que juntam até 3 efeitos.","Clear the board before the time runs out.":"Limpa o tabuleiro antes de o tempo acabar.","1 life left":"1 vida restante","No lives":"Sem vidas","Free play":"Jogo livre","Free play, no lives to lose":"Jogo livre, sem vidas a perder",Hint:"Dica",Rewind:"Voltar",Restart:"Reiniciar",Guide:"Guia",Levels:"Níveis","Red cards are blocking the board. Rewind and play them in time.":"Os cartões vermelhos estão a bloquear o tabuleiro. Volta atrás e joga-os a tempo.","Nothing can move. Rewind one step.":"Nada se pode mexer. Volta uma jogada atrás.","This board cannot clear from here. Rewind a step or two.":"Daqui já não dá para limpar o tabuleiro. Volta uma ou duas jogadas atrás.","Spectacular!":"Espetacular!","Amazing!":"Incrível!","Great job!":"Muito bem!","Wonderful!":"Maravilha!","Lovely!":"Que bonito!","Beautiful!":"Lindo!","Brilliant!":"Brilhante!","Nice one!":"Boa!","Well done!":"Bem feito!","Superb!":"Fantástico!","20% chance per launch that arrows freeze":"20% de hipótese por lançamento de as set ns out":"Limpa cada tabuleiro antes de o tempo acabar","Season effects":"Efeitos das estações","Pick any number. Random uses 1 to 4 for each board.":"Escolhe quantos quiseres. Aleatório usa 1 a 4 em cada tabuleiro.",None:"Nenhum",Random:"Aleatório","You can also change it while playing.":"Também podes mudar durante o jogo.","Map size":"Tamanho do mapa","Bigger maps can be zoomed and moved around":"Nos mapas maiores podes aproximar e mover a vista","Play Open Waters":"Jogar em Águas Abertas","© 2026 Miguel Lima. All rights reserved.":"© 2026 Miguel Lima. Todos os direitos reservados.",Understood:"Entendido",Arrow:"Seta","Tap it to send it off the board. If something is in its way, it bounces back and costs a life.":"Toca para a enviar para fora do tabuleiro. Se houver algo no caminho, ressalta e custa uma vida.","Same colour and letter. They leave together, so both of their paths must be clear.":"A mesma cor e a mesma letra. Saem juntas, por isso os dois caminhos têm de estar livres.","Turns a quarter clockwise each time an arrow leaves. The wrong order can leave you stuck, so use Rewind.":"Roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai uma seta. A ordem errada pode deixar-te preso, por isso usa Voltar.","Moon arrow":"Seta lua","Star arrow":"Seta estrela","Asleep and dashed. It cannot move until the star arrow with the same number leaves. Tapping it early costs nothing.":"Adormecida e tracejada. Não se mexe até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.","When it leaves, it wakes the moon arrow with the same number, at the other end of its golden thread.":"Quando sai, acorda a seta lua com o mesmo número, na outra ponta do fio dourado.",Mirror:"Espelho","Not an arrow. It turns any arrow passing through by 90 degrees, so follow the new path.":"Não é uma seta. Roda 90 graus qualquer seta que passe por ele, por isso segue o novo caminho.","Patient arrow":"Seta paciente","Its number shows how many more launches it needs before it can leave. Tapping it early costs nothing.":"O número mostra quantos lançamentos faltam até poder sair. Tocar antes de tempo não custa nada.","Ghost arrow":"Seta fantasma","Swaps form after every launch. See-through as a ghost: it cannot be played, and other arrows pass through it. Solid: it plays and blocks like any arrow.":"Muda de forma depois de cada lançamento. Transparente: não pode ser jogada e as outras setas passam por ela. Sólida: joga e bloqueia como qualquer seta.","Reverse arrow":"Seta inversa","Orange. Its tip swaps to the other end after every launch, and the faint mark shows where it goes next. Play it when the end it points from has a clear way out.":"Cor de laranja. A ponta troca para a outra extremidade depois de cada lançamento, e a marca ténue mostra para onde vai a seguir. Joga-a quando a ponta tiver o caminho livre.","Phase arrow":"Seta atravessadora","Purple. Can slip through one occupied tile on its way out, whether an arrow, a flower or fire, but not two in a row.":"Roxa. Consegue atravessar uma casa ocupada ao sair, seja uma seta, uma flor ou fogo, mas não duas seguidas.","Red card arrow":"Seta de cartão vermelho","Play it before its count reaches zero. If not, it is sent off: it cannot move until only sent-off arrows remain, and it can block the rest. Rewind if that traps you.":"Joga-a antes de a contagem chegar a zero. Senão, é expulsa: não se mexe até só restarem setas expulsas, e pode bloquear as outras. Volta atrás se ficares preso.","Frozen arrow":"Seta congelada","Winter. It cannot move, and it blocks others. It thaws by itself after 3 to 5 launches, or hit it with another arrow to free it sooner, at no cost.":"Inverno. Não se mexe e bloqueia as outras. Derrete sozinha ao fim de 3 a 5 lançamentos, ou acerta-lhe com outra seta para a libertares mais cedo, sem custos.","Burning tile":"Casa a arder","Summer. Blocks arrows for 2 to 4 launches. Hitting it costs a life.":"Verão. Bloqueia as setas durante 2 a 4 lançamentos. Acertar nela custa uma vida.","Flower and bee":"Flor e abelha","Spring. Flowers block arrows, and hitting one costs a life. After each launch, the bee carries its flower away.":"Primavera. As flores bloqueiam as setas, e acertar numa custa uma vida. Depois de cada lançamento, a abelha leva a sua flor.",Wind:"Vento","Autumn. Can spin an arrow fully around its tail if there is room. Short arrows spin most often, and more can turn as the board clears.":"Outono. Pode rodar uma seta à volta da cauda, se houver espaço. As setas curtas rodam mais vezes, e podem rodar mais à medida que o tabuleiro fica livre.","Arrow guide":"Guia das setas","On this board":"Neste tabuleiro","▶ Watch how it works":"▶ Ver como funciona","Music and sound":"Música e som",Settings:"Definições",Language:"Idioma",Music:"Música","Sound effects":"Efeitos sonoros",Theme:"Tema","Follow the level":"Seguir o nível","Matches the time of day or season":"Acompanha a hora do dia ou a estação do ano","Music is off":"Música desligada","Sound on for the full experience":"Liga o som para a experiência completa","Tap to begin":"Toca para começar","Puzzle board. Tap an arrow to send it off the board.":"Tabuleiro do puzzle. Toca numa seta para a enviar para fora do tabuleiro.","Music and sound settings":"Definições de música e som","Settings ":"Definições","Choose a background":"Escolher um fundo","Zoom in":"Aproximar","Zoom out":"Afastar","Show the whole board":"Mostrar o tabuleiro todo",Close:"Fechar","Tap an arrow to send it off the board. Get them all out to win.":"Toca numa seta para a enviar para fora do tabuleiro. Tira-as todas para ganhar.","Hit a frozen arrow with another arrow to open the way. It costs nothing.":"Acerta numa seta congelada com outra seta para abrires caminho. Não custa nada.",Next:"Próxima","Next play: the highlighted arrow.":"Próxima jogada: a seta destacada.","A play exists, but this board may not clear from here.":"Há uma jogada, mas daqui o tabuleiro pode não ficar limpo.","Nex ":"1 vida para cada jogador, sem dicas e setas com vários efeitos ao mesmo tempo","3 lives for each player, extra time and no hints":"3 vidas para cada jogador, tempo extra e sem dicas","1 life for each player and combo arrows that mix up to 3 effects":"1 vida para cada jogador e setas combo que juntam até 3 efeitos","3 lives for each player and extra time":"3 vidas para cada jogador e tempo extra","Creating room…":"A criar a sala…","Room preview (simulated)":"Pré-visualização da sala (simulada)","The room screen with pretend players, no server needed.":"O ecrã da sala com jogadores a fingir, sem servidor.","Looking for rooms…":"A procurar salas…","Could not reach the online server. Check your connection and refresh.":"Não foi possível ligar ao servidor online. Verifica a ligação e atualiza.","Could not reach the online server. Check your connection and try again.":"Não foi possível ligar ao servidor online. Verifica a ligação e tenta outra vez.","Could not reach the online server.":"Não foi possível ligar ao servidor online.","There is no room with that code.":"Não existe nenhuma sala com esse código.","That game has already started.":"Esse jogo já começou.","That room is full.":"Essa sala está cheia.","The host removed you from the room.":"O anfitrião removeu-te da sala.","Lost the connection to the room.":"Perdeu-se a ligação à sala.","Connection lost. Reconnecting…":"Ligação perdida. A voltar a ligar…","This room is full.":"Esta sala está cheia.","This game has already started.":"Este jogo já começou.","Only the host can change the settings.":"Só o anfitrião pode mudar as definições.","Remove players before making the room smaller.":"Remove jogadores antes de tornar a sala mais pequena.","Wait until every seat is taken.":"Espera até todos os lugares estarem ocupados.","Everyone has to be Ready.":"Todos têm de estar prontos.","Only the host can start.":"Só o anfitrião pode começar.","Names are fixed once the game starts.":"Os nomes ficam fixos quando o jogo começa.","The game is paused.":"O jogo está em pausa.","You can only play your own board.":"Só podes jogar no teu tabuleiro.","This game is over.":"Este jogo terminou.","Online games cannot be restarted. Clear the boards together!":"Os jogos online não podem recomeçar. Limpem os tabuleiros juntos!","Main Menu":"Menu principal","Play with friends":"Jogar com amigos","Learn the online arrows":"Aprende as setas online","Leave online game":"Sair do jogo online","Back to your game":"Voltar ao teu jogo","Server not reachable":"Servidor inacessível","You left this game.":"Saíste deste jogo.","Multiple board arrows":"Setas de vários tabuleiros","Multiple boards":"Vários tabuleiros","Learn the multiple board arrows":"Aprende as setas de vários tabuleiros","Boarding Up":"Tabuleiros em Grupo",Challenges:"Desafios",Endless:"Infinito",Daily:"Diário","Solo levels on several boards at once. You play every board, and twin-shared and sniper arrows link them.":"Níveis a solo em vários tabuleiros ao mesmo tempo. Jogas em todos, e as setas gémeas partilhadas e sniper ligam-nos.","Two boards! Twin-shared arrows leave together, so clear the way on both.":"Dois tabuleiros! As setas gémeas partilhadas saem juntas, por isso abre caminho nos dois.","Sniper arrows fly to the other board and knock out the first arrow they hit.":"As setas sniper voam para o outro tabuleiro e derrubam a primeira seta em que acertam.","Both kinds together. Plan which board to play next.":"Os dois tipos juntos. Planeia em que tabuleiro jogas a seguir.","Four boards now, in two rows. Snipers can fly up and down too.":"Agora quatro tabuleiros, em duas filas. As snipers também voam para cima e para baixo.","Special arrows join in: compass, patient and moon and star.":"Juntam-se setas especiais: bússola, paciente e lua e estrela.","Ghost, phase and reverse arrows on every board.":"Setas fantasma, atravessadoras e inversas em todos os tabuleiros.","The big one: four full boards and every kind of arrow.":"O grande desafio: quatro tabuleiros completos e todos os tipos de setas.","Golden ticket":"Bilhete dourado",Thaw:"Degelo","Sent off":"Expulsos","Get the board stuck on purpose, so the safety net hands you a golden arrow.":"Encrava o tabuleiro de propósito, para que a rede de segurança te dê uma seta dourada.","Free every frozen arrow. Hit a frozen arrow with another arrow to thaw it.":"Liberta todas as setas congeladas. Acerta numa seta congelada com outra seta para a descongelar.","Get every red card arrow sent off at the same time, without losing all your lives.":"Faz com que todas as setas de cartão vermelho sejam expulsas ao mesmo tempo, sem perder todas as vidas.","Challenge: make a golden arrow appear. Get the board stuck on purpose.":"Desafio: faz aparecer uma seta dourada. Encrava o tabuleiro de propósito.","Challenge: thaw every frozen arrow. Hit them with other arrows.":"Desafio: descongela todas as setas congeladas. Acerta-lhes com outras setas.","Challenge: get every red card arrow sent off at once.":"Desafio: faz com que todas as setas de cartão vermelho sejam expulsas ao mesmo tempo.","Not quite":"Quase","The board is clear, but the challenge was not met. Try another order.":"O tabuleiro está limpo, mas o desafio não foi cumprido. Tenta outra ordem.","Next challenge":"Próximo desafio","Back to challenges":"Voltar aos desafios","1 board":"1 tabuleiro","2 boards":"2 tabuleiros","4 boards":"4 tabuleiros","You play every board. Up to 5x each, no timer.":"Jogas em todos os tabuleiros. Até 5x cada, sem relógio.","One board, or several linked boards to play alone":"Um tabuleiro, ou vários tabuleiros ligados para jogar sozinho","Season effects work on a single board.":"Os efeitos das estações só funcionam com um tabuleiro.","Pick any number, or All for every effect at once.":"Escolhe quantos quiseres, ou Todas para todos os efeitos ao mesmo tempo.","All clear, together!":"Tudo limpo, juntos!","Every board is clear.":"Todos os tabuleiros estão limpos.","The room ran out of shared lives.":"A sala ficou sem vidas partilhadas.","Someone left, so this game cannot be played again. Go back to the room to start a new one.":"Alguém saiu, por isso este jogo não pode ser repetido. Volta à sala para começar outro.","Go back to the online room":"Voltar à sala online","Challenge complete!":"Desafio concluído!","Playing several boards":"Jogar em vários tabuleiros","In Boarding Up and multi-board Open Waters you play every board yourself. Tap the arrow button at the edge of the screen to move to the next board, and again to come back. Lives are shared, and you win when every board is clear.":"Em Tabuleiros em Grupo e nas Águas Abertas com vários tabuleiros jogas em todos os tabuleiros. Toca no botão de seta na borda do ecrã para ires para o tabuleiro seguinte, e outra vez para voltares. As vidas são partilhadas e ganhas quando todos os tabuleiros estiverem limpos.","Board 1":"Tabuleiro 1","Board 2":"Tabuleiro 2","Every board is yours to play":"Todos os tabuleiros são teus","Switch boards with the edge arrows":"Muda de tabuleiro com as setas das bordas","Lives are shared by all boards":"As vidas são partilhadas por todos","Clear every board to win":"Limpa todos os tabuleiros para ganhar","How several boards work":"Como funcionam vários tabuleiros","A quick look before you start.":"Uma vista rápida antes de começares.","Go back to the room":"Voltar à sala","Challenge complete!":"Desafio concluído!","You play every board, up to 5x each. The timer adds up every board and doubles it.":"Jogas em todos os tabuleiros, até 5x cada. O tempo soma todos os tabuleiros e duplica.","Each board gets its own season effects.":"Cada tabuleiro tem os seus próprios efeitos de estação.","Get the board truly stuck, with no arrow able to leave, so the safety net hands you a golden arrow. Two lives and no hints. Each level adds more arrow types.":"Deixa o tabuleiro mesmo encravado, sem nenhuma seta capaz de sair, para a rede de segurança te dar uma seta dourada. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Free every frozen arrow. Hit a frozen arrow with another arrow to thaw it. The ice never melts by itself here. Two lives and no hints. Each level adds more arrow types.":"Liberta todas as setas congeladas. Acerta numa seta congelada com outra seta para a descongelar. Aqui o gelo nunca derrete sozinho. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Get every red card arrow sent off before they expire. Two lives and no hints. Each level adds more arrow types.":"Faz com que todas as setas de cartão vermelho sejam expulsas antes de expirarem. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Waiting for every player to load…":"À espera que todos os jogadores carreguem…","Out of time":"Sem tempo","The shared clock ran out.":"O tempo partilhado acabou.","Send off all the red card arrows before they expire":"Expulsa todas as setas de cartão vermelho antes de expirarem","A red card expired":"Um cartão vermelho expirou","A red card arrow ran out of launches before it left. Send off the red cards first.":"Uma seta de cartão vermelho ficou sem lançamentos antes de sair. Expulsa primeiro os cartões vermelhos.","Special arrows":"Setas especiais","Board 1 of 2":"Tabuleiro 1 de 2","Board 2 of 2":"Tabuleiro 2 de 2","Play the arrows on this board":"Joga as setas deste tabuleiro","Tap the edge button to move to board 2":"Toca no botão da borda para ires para o tabuleiro 2","Board 2 is yours to play too":"O tabuleiro 2 também é teu","Tap it again to go back":"Toca outra vez para voltares","Play the intro":"Ver a introdução",Skip:"Saltar","A cozy and relaxing puzzle game with arrows":"Um jogo de puzzle aconchegante e relaxante com setas","Created by Miguel Lima":"Criado por Miguel Lima","Created by Hearthbound Games":"Criado por Hearthbound Games","We hope you can enjoy...":"Esperamos que possas desfrutar...","...and relax with our game":"...e relaxar com o nosso jogo","We present to you:":"Apresentamos-te:","This sniper is blocked on this board.":"Este atirador está bloqueado neste tabuleiro.","No board that way: this shot would fly off.":"Não há tabuleiro nessa direção: o tiro perdia-se.","Made with care, one arrow at a time":"Feito com carinho, uma seta de cada vez","The red arrow with a sight is a sniper. When it leaves, it flies on to the next board and destroys the first arrow it hits. Hold it to see where it would land.":"A seta vermelha com mira é um atirador. Quando sai, voa para o tabuleiro seguinte e destrói a primeira seta em que acerta. Mantém-na premida para veres onde ia acertar.","Multiple boards only. When a sniper arrow leaves its board, it flies on to the next board and destroys the first arrow it hits there. The hit does not count as a move. Hold it to see that board and where it would hit.":"Só com vários tabuleiros. Quando uma seta atiradora sai do seu tabuleiro, voa para o tabuleiro seguinte e destrói a primeira seta em que acerta. O impacto não conta como jogada. Mantém-na premida para veres esse tabuleiro e onde ia acertar.","Multiple boards only. Same colour, letter and a plus. They leave together with their twins on other boards, so every path must be clear. Hold one to see its twins on the other boards.":"Só com vários tabuleiros. Mesma cor, letra e um mais. Saem juntas com as gémeas noutros tabuleiros, por isso todos os caminhos têm de estar livres. Mantém uma premida para veres as gémeas nos outros tabuleiros.","Same colour, letter and a plus. They leave together with their twins on the other boards, so every path must be clear. Hold one to see its twins on the other boards.":"Mesma cor, letra e um mais. Saem juntas com as gémeas nos outros tabuleiros, por isso todos os caminhos têm de estar livres. Mantém uma premida para veres as gémeas nos outros tabuleiros.","Flies on to the next board and destroys the first arrow it hits there. The hit does not count as a move. Hold it to see that board and where it would hit.":"Voa para o tabuleiro seguinte e destrói a primeira seta em que acerta. O impacto não conta como jogada. Mantém-na premida para veres esse tabuleiro e onde ia acertar.","Clear the way for X+ here too. Hold an X+ arrow to see its twin on the other board.":"Abre caminho para o X+ aqui também. Mantém uma seta X+ premida para veres a gémea no outro tabuleiro.",Tip:"Dica","Tap this message any time to watch the video again.":"Toca nesta mensagem quando quiseres para veres o vídeo outra vez.","Got it":"Percebi","Co-op test: big boards":"Teste cooperativo: tabuleiros grandes","Same test, each board three times the size.":"O mesmo teste, com cada tabuleiro três vezes maior.","Temporary. You control all four boards.":"Temporário. Controlas os quatro tabuleiros.","Co-op test: clear all four boards. Use the arrows at the edges to switch boards.":"Teste cooperativo: limpa os quatro tabuleiros. Usa as setas nas margens para mudar de tabuleiro.","Wait: a sniper is coming in.":"Espera: vem aí um sniper.","A sniper is coming in!":"Vem aí um sniper!","Co-op test":"Teste cooperativo","Twins leave together. Both paths must be clear.":"As gémeas saem juntas. Os dois caminhos têm de estar livres.","Compass arrows turn a quarter each time something leaves.":"As setas bússola rodam um quarto de volta sempre que algo sai.","Moon arrows are asleep. Send the star arrow away to wake them.":"As setas lua estão a dormir. Faz sair a seta estrela para as acordares.","Mirrors turn an arrow on its way out. Follow the new path.":"Os espelhos viram a seta ao sair. Segue o novo caminho.","Patient arrows show a number. They can leave after that many launches.":"As setas pacientes mostram um número. Podem sair ao fim desses lançamentos.","Ghost arrows swap form on every launch. Play them only when solid.":"As setas fantasma mudam de forma a cada lançamento. Joga-as só quando estão sólidas.","Phase arrows can slip through one blocked tile on their way out.":"As setas atravessadoras conseguem atravessar uma casa ocupada ao sair.","Play this arrow before its count runs out, or it gets a red card.":"Joga esta seta antes de a contagem acabar, ou leva cartão vermelho.","Reverse arrows swap their tip to the other end on every launch.":"As setas inversas trocam a ponta para a outra extremidade a cada lançamento.","Ice can trap arrows. Hit a frozen arrow with another arrow to free it.":"O gelo pode prender setas. Acerta numa seta congelada com outra para a libertares.","Flowers block arrows. Each launch, a bee carries one away.":"As flores bloqueiam as setas. A cada lançamento, uma abelha leva uma.","Burning tiles stop arrows for a few launches. Wait, or find another way.":"As casas a arder travam as setas durante alguns lançamentos. Espera, ou procura outro caminho.","Wind can spin arrows around their tails when there is room.":"O vento pode rodar as setas à volta da cauda, quando há espaço.","Get every arrow off the board":"Tira todas as setas do tabuleiro","The goal of the game is to make every arrow leave the board. An arrow leaves the way it points, so its path must be clear. Hitting another arrow costs a life.":"O objetivo do jogo é fazer sair todas as setas do tabuleiro. Uma seta sai na direção para onde aponta, por isso o caminho tem de estar livre. Acertar noutra seta custa uma vida.","Tap an arrow and it leaves the way it points":"Toca numa seta e ela sai na direção para onde aponta","If another arrow is in the way, it bounces back":"Se houver outra seta no caminho, ressalta","So clear the way first":"Por isso, liberta primeiro o caminho","Now it can leave too":"Agora também pode sair","All arrows gone: board cleared!":"Saíram todas: tabuleiro limpo!","Twins share a colour and a letter. They leave together, so both paths must be clear.":"As gémeas têm a mesma cor e letra. Saem juntas, por isso os dois caminhos têm de estar livres.","One twin is blocked, so neither can go":"Uma gémea está bloqueada, por isso nenhuma sai","Clear the way first":"Primeiro, liberta o caminho","Now both leave together":"Agora saem as duas juntas","A compass arrow turns a quarter clockwise every time another arrow leaves.":"Uma seta bússola roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai outra seta.","It points at another arrow":"Aponta para outra seta","Each launch turns it a quarter":"Cada lançamento roda-a um quarto de volta","Now it has a clear way out":"Agora tem o caminho livre","Moon and star":"Lua e estrela","A moon arrow sleeps until the star arrow with the same number leaves. Tapping it early costs nothing.":"Uma seta lua dorme até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.","The moon arrow is asleep":"A seta lua está a dormir","Send its star arrow away":"Faz sair a sua seta estrela","Now it wakes and can leave":"Agora acorda e pode sair","A mirror turns any arrow passing through it by 90 degrees, so follow the new path.":"Um espelho roda 90 graus qualquer seta que passe por ele, por isso segue o novo caminho.","The mirror sends it up, into an arrow":"O espelho envia-a para cima, contra uma seta","Clear the new path":"Liberta o novo caminho","It turns at the mirror and leaves":"Vira no espelho e sai","Its number shows how many more launches it needs before it can leave.":"O número mostra quantos lançamentos faltam até poder sair.","It needs 2 more launches":"Faltam 2 lançamentos","One launch":"Um lançamento","Two launches":"Dois lançamentos","Now it can leave":"Agora pode sair","It swaps form after every launch. As a ghost it cannot be played, and arrows pass through it.":"Muda de forma depois de cada lançamento. Como fantasma não pode ser jogada, e as setas passam por ela.","See-through: it cannot be played":"Transparente: não pode ser jogada","Other arrows pass right through it":"As outras setas passam por ela","After a launch it is solid and can go":"Depois de um lançamento fica sólida e pode sair","A phase arrow slips through one occupied tile: an arrow, a flower or fire. But not two in a row.":"Uma seta atravessadora passa por uma casa ocupada: uma seta, uma flor ou fogo. Mas não duas seguidas.","It slips through the arrow in its way":"Atravessa a seta no caminho","A normal arrow could not do that":"Uma seta normal não conseguia","Play it before its count runs out. If not, it is sent off until only sent-off arrows remain.":"Joga-a antes de a contagem acabar. Senão, é expulsa até só restarem setas expulsas.","Each launch lowers its count":"Cada lançamento baixa a contagem","At zero it gets a red card":"A zero leva cartão vermelho","Sent off: it cannot move now":"Expulsa: agora não se pode mexer","Clear everything else":"Limpa tudo o resto","Only then can it leave":"Só então pode sair","Its tip swaps to the other end after every launch. The faint mark shows where it goes next.":"A ponta troca para a outra extremidade depois de cada lançamento. A marca ténue mostra para onde vai a seguir.","Its tip points at another arrow":"A ponta aponta para outra seta","After a launch the tip swaps ends":"Depois de um lançamento, a ponta troca de lado","Now it leaves the other way":"Agora sai pelo outro lado","Winter. It cannot move, and it blocks others. It thaws by itself, or hit it with an arrow to free it at no cost.":"Inverno. Não se mexe e bloqueia as outras. Derrete sozinha, ou acerta-lhe com uma seta para a libertares sem custos.","Hit it to crack the ice, for free":"Acerta-lhe para partires o gelo, sem custos","Now it is free to go":"Agora está livre para sair","And the way is clear":"E o caminho fica livre","Summer. Fire blocks arrows for a few launches, and hitting it costs a life. Wait for it to burn out.":"Verão. O fogo bloqueia as setas durante alguns lançamentos, e acertar nele custa uma vida. Espera que se apague.","Fire in the way costs a life":"Fogo no caminho custa uma vida","Play other arrows instead":"Joga antes outras setas","The fire burns out":"O fogo apaga-se","Now the way is clear":"Agora o caminho está livre","Spring. Flowers block arrows. After each launch, a bee carries one flower away.":"Primavera. As flores bloqueiam as setas. Depois de cada lançamento, uma abelha leva uma flor.","A flower blocks the way":"Uma flor bloqueia o caminho","After a launch, a bee takes it":"Depois de um lançamento, uma abelha leva-a","Autumn. Wind can spin an arrow around its tail when there is room, which can change everything.":"Outono. O vento pode rodar uma seta à volta da cauda quando há espaço, e isso pode mudar tudo.","This arrow is blocked":"Esta seta está bloqueada","A launch can bring a gust that spins an arrow":"Um lançamento pode trazer uma rajada que roda uma seta","Now it has a new way out":"Agora tem uma nova saída","First Light":"Primeira Luz","Still Water":"Água Parada","Lantern Hour":"Hora das Lanternas","Night Swim":"Mergulho Noturno",Snowfall:"Neve a Cair",Meadow:"Prado",Sandbar:"Banco de Areia","Amber Leaves":"Folhas de Âmbar","Rolling felt piano":"Piano suave","Playful wooden kalimba":"Kalimba de madeira brincalhona","Music box waltz":"Valsa de caixa de música","Slow, dreamy electric piano":"Piano elétrico lento e sonhador","Winter: a tiptoeing celesta dance":"Inverno: uma dança de celesta em bicos de pés","Spring: a cheerful ukulele and a whistled tune":"Primavera: um ukulele alegre e uma melodia assobiada","Summer: lazy bossa guitar":"Verão: guitarra de bossa preguiçosa","Autumn: warm cello and a slow waltz":"Outono: violoncelo quente e uma valsa lenta"},a={Level:"Nível",Hard:"Difícil",Timed:"Cronometrado",Winter:"Inverno",Spring:"Primavera",Summer:"Verão",Autumn:"Outono","Open Water":"Águas Abertas","Open Waters":"Águas Abertas"},i=[[/^Hint (\d+)$/,"Dica $1"],[/^Board (\d+) of (\d)$/,"Tabuleiro $1 de $2"],[/^Board (\d+) cleared! Help clear the others\.$/,"Tabuleiro $1 limpo! Ajuda a limpar os outros."],[/^Board (\d+) is cleared\.$/,"O tabuleiro $1 está limpo."],[/^Something is happening on board (\d+)\.$/,"Está a acontecer algo no tabuleiro $1."],[/^Its twin on board (\d+) is blocked\.$/,"A gémea no ta
