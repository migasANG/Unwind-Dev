:root{
--ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
--display:"Fredoka","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
.scenebg{position:fixed;inset:0;overflow:hidden}
.scenebg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenebg.baking *{animation:none!important}

pa cada tabuleiro antes de o tempo acabar","Season effects":"Efeitos das estações","Pick any number. Random uses 1 to 4 for each board.":"Escolhe quantos quiseres. Aleatório usa 1 a 4 em cada tabuleiro.",None:"Nenhum",Random:"Aleatório","You can also change it while playing.":"Também podes mudar durante o jogo.","Map size":"Tamanho do mapa","Bigger maps can be zoomed and moved around":"Nos mapas maiores podes aproximar e mover a vista","Play Open Waters":"Jogar em Águas Abertas","© 2026 Miguel Lima. All rights reserved.":"© 2026 Miguel Lima. Todos os direitos reservados.",Understood:"Entendido",Arrow:"Seta","Tap it to send it off the board. If something is in its way, it bounces back and costs a life.":"Toca para a enviar para fora do tabuleiro. Se houver algo no caminho, ressalta e custa uma vida.","Same colour and letter. They leave together, so both of their paths must be clear.":"A mesma cor e a mesma letra. Saem juntas, por isso os dois caminhos têm de estar livres.","Turns a quarter clockwise each time an arrow leaves. The wrong order can leave you stuck, so use Rewind.":"Roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai uma seta. A ordem errada pode deixar-te preso, por isso usa Voltar.","Moon arrow":"Seta lua","Star arrow":"Seta estrela","Asleep and dashed. It cannot move until the star arrow with the same number leaves. Tapping it early costs nothing.":"Adormecida e tracejada. Não se mexe até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.","When it leaves, it wakes the moon arrow with the same number, at the other end of its golden thread.":"Quando sai, acorda a seta lua com o mesmo número, na outra ponta do fio dourado.",Mirror:"Espelho","Not an arrow. It turns any arrow passing through by 90 degrees, so follow the new path.":"Não é uma seta. Roda 90 graus qualquer seta que passe por ele, por isso segue o novo caminho.","Patient arrow":"Seta paciente","Its number shows how many more launches it needs before it can leave. Tapping it early costs nothing.":"O número mostra quantos lançamentos faltam até poder sair. Tocar antes de tempo não custa nada.","Ghost arrow":"Seta fantasma","Swaps form after every launch. See-through as a ghost: it cannot be played, and other arrows pass through it. Solid: it plays and blocks like any arrow.":"Muda de forma depois de cada lançamento. Transparente: não pode ser jogada e as outras setas passam por ela. Sólida: joga e bloqueia como qualquer seta.","Reverse arrow":"Seta inversa","Orange. Its tip swaps to the other end after every launch, and the faint mark shows where it goes next. Play it when the end it points from has a clear way out.":"Cor de laranja. A ponta troca para a outra extremidade depois de cada lançamento, e a marca ténue mostra para onde vai a seguir. Joga-a quando a ponta tiver o caminho livre.","Phase arrow":"Seta atravessadora","Purple. Can slip through one occupied tile on its way out, whether an arrow, a flower or fire, but not two in a row.":"Roxa. Consegue atravessar uma casa ocupada ao sair, seja uma seta, uma flor ou fogo, mas não duas seguidas.","Red card arrow":"Seta de cartão vermelho","Play it before its count reaches zero. If not, it is sent off: it cannot move until only sent-off arrows remain, and it can block the rest. Rewind if that traps you.":"Joga-a antes de a contagem chegar a zero. Senão, é expulsa: não se mexe até só restarem setas expulsas, e pode bloquear as outras. Volta atrás se ficares preso.","Frozen arrow":"Seta congelada","Winter. It cannot move, and it blocks others. It thaws by itself after 3 to 5 launches, or hit it with another arrow to free it sooner, at no cost.":"Inverno. Não se mexe e bloqueia as outras. Derrete sozinha ao fim de 3 a 5 lançamentos, ou acerta-lhe com outra seta para a libertares mais cedo, sem custos.","Burning tile":"Casa a arder","Summer. Blocks arrows for 2 to 4 launches. Hitting it costs a life.":"Verão. Bloqueia as setas durante 2 a 4 lançamentos. Acertar nela custa uma vida.","Flower and bee":"Flor e abelha","Spring. Flowers block arrows, and hitting one costs a life. After each launch, the bee carries its flower away.":"Primavera. As flores bloqueiam as setas, e acertar numa custa uma vida. Depois de cada lançamento, a abelha leva a sua flor.",Wind:"Vento","Autumn. Can spin an arrow fully around its tail if there is room. Short arrows spin most often, and more can turn as the board clears.":"Outono. Pode rodar uma seta à volta da cauda, se houver espaço. As setas curtas rodam mais vezes, e podem rodar mais à medida que o tabuleiro fica livre.","Arrow guide":"Guia das setas","On this board":"Neste tabuleiro","▶ Watch how it works":"▶ Ver como funciona","Music and sound":"Música e som",Settings:"Definições",Language:"Idioma",Music:"Música","Sound effects":"Efeitos sonoros",Theme:"Tema","Follow the level":"Seguir o nível","Matches the time of day or season":"Acompanha a hora do dia ou a estação do ano","Music is off":"Música desligada","Sound on for the full experience":"Liga o som para a experiência completa","Tap to begin":"Toca para começar","Puzzle board. Tap an arrow to send it off the board.":"Tabuleiro do puzzle. Toca numa seta para a enviar para fora do tabuleiro.","Music and sound settings":"Definições de música e som","Settings ":"Definições","Choose a background":"Escolher um fundo","Zoom in":"Aproximar","Zoom out":"Afastar","Show the whole board":"Mostrar o tabuleiro todo",Close:"Fechar","Tap an arrow to send it off the board. Get them all out to win.":"Toca numa seta para a enviar para fora do tabuleiro. Tira-as todas para ganhar.","Hit a frozen arrow with another arrow to open the way. It costs nothing.":"Acerta numa seta congelada com outra seta para abrires caminho. Não custa nada.",Next:"Próxima","Next play: the highlighted arrow.":"Próxima jogada: a seta destacada.","A play exists, but this board may not clear from here.":"Há uma jogada, mas daqui o tabuleiro pode não ficar limpo.","Next play: hit  arrow with another arrow to thaw it.":"Liberta todas as setas congeladas. Acerta numa seta congelada com outra seta para a descongelar.","Get every red card arrow sent off at the same time, without losing all your lives.":"Faz com que todas as setas de cartão vermelho sejam expulsas ao mesmo tempo, sem perder todas as vidas.","Challenge: make a golden arrow appear. Get the board stuck on purpose.":"Desafio: faz aparecer uma seta dourada. Encrava o tabuleiro de propósito.","Challenge: thaw every frozen arrow. Hit them with other arrows.":"Desafio: descongela todas as setas congeladas. Acerta-lhes com outras setas.","Challenge: get every red card arrow sent off at once.":"Desafio: faz com que todas as setas de cartão vermelho sejam expulsas ao mesmo tempo.","Not quite":"Quase","The board is clear, but the challenge was not met. Try another order.":"O tabuleiro está limpo, mas o desafio não foi cumprido. Tenta outra ordem.","Next challenge":"Próximo desafio","Back to challenges":"Voltar aos desafios","1 board":"1 tabuleiro","2 boards":"2 tabuleiros","4 boards":"4 tabuleiros","You play every board. Up to 5x each, no timer.":"Jogas em todos os tabuleiros. Até 5x cada, sem relógio.","One board, or several linked boards to play alone":"Um tabuleiro, ou vários tabuleiros ligados para jogar sozinho","Season effects work on a single board.":"Os efeitos das estações só funcionam com um tabuleiro.","Pick any number, or All for every effect at once.":"Escolhe quantos quiseres, ou Todas para todos os efeitos ao mesmo tempo.","All clear, together!":"Tudo limpo, juntos!","Every board is clear.":"Todos os tabuleiros estão limpos.","The room ran out of shared lives.":"A sala ficou sem vidas partilhadas.","Someone left, so this game cannot be played again. Go back to the room to start a new one.":"Alguém saiu, por isso este jogo não pode ser repetido. Volta à sala para começar outro.","Go back to the online room":"Voltar à sala online","Challenge complete!":"Desafio concluído!","Playing several boards":"Jogar em vários tabuleiros","In Boarding Up and multi-board Open Waters you play every board yourself. Tap the arrow button at the edge of the screen to move to the next board, and again to come back. Lives are shared, and you win when every board is clear.":"Em Tabuleiros em Grupo e nas Águas Abertas com vários tabuleiros jogas em todos os tabuleiros. Toca no botão de seta na borda do ecrã para ires para o tabuleiro seguinte, e outra vez para voltares. As vidas são partilhadas e ganhas quando todos os tabuleiros estiverem limpos.","Board 1":"Tabuleiro 1","Board 2":"Tabuleiro 2","Every board is yours to play":"Todos os tabuleiros são teus","Switch boards with the edge arrows":"Muda de tabuleiro com as setas das bordas","Lives are shared by all boards":"As vidas são partilhadas por todos","Clear every board to win":"Limpa todos os tabuleiros para ganhar","How several boards work":"Como funcionam vários tabuleiros","A quick look before you start.":"Uma vista rápida antes de começares.","Go back to the room":"Voltar à sala","Challenge complete!":"Desafio concluído!","You play every board, up to 5x each. The timer adds up every board and doubles it.":"Jogas em todos os tabuleiros, até 5x cada. O tempo soma todos os tabuleiros e duplica.","Each board gets its own season effects.":"Cada tabuleiro tem os seus próprios efeitos de estação.","Get the board truly stuck, with no arrow able to leave, so the safety net hands you a golden arrow. Two lives and no hints. Each level adds more arrow types.":"Deixa o tabuleiro mesmo encravado, sem nenhuma seta capaz de sair, para a rede de segurança te dar uma seta dourada. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Free every frozen arrow. Hit a frozen arrow with another arrow to thaw it. The ice never melts by itself here. Two lives and no hints. Each level adds more arrow types.":"Liberta todas as setas congeladas. Acerta numa seta congelada com outra seta para a descongelar. Aqui o gelo nunca derrete sozinho. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Get every red card arrow sent off before they expire. Two lives and no hints. Each level adds more arrow types.":"Faz com que todas as setas de cartão vermelho sejam expulsas antes de expirarem. Duas vidas e sem dicas. Cada nível junta mais tipos de setas.","Waiting for every player to load…":"À espera que todos os jogadores carreguem…","Out of time":"Sem tempo","The shared clock ran out.":"O tempo partilhado acabou.","Send off all the red card arrows before they expire":"Expulsa todas as setas de cartão vermelho antes de expirarem","A red card expired":"Um cartão vermelho expirou","A red card arrow ran out of launches before it left. Send off the red cards first.":"Uma seta de cartão vermelho ficou sem lançamentos antes de sair. Expulsa primeiro os cartões vermelhos.","Special arrows":"Setas especiais","Board 1 of 2":"Tabuleiro 1 de 2","Board 2 of 2":"Tabuleiro 2 de 2","Play the arrows on this board":"Joga as setas deste tabuleiro","Tap the edge button to move to board 2":"Toca no botão da borda para ires para o tabuleiro 2","Board 2 is yours to play too":"O tabuleiro 2 também é teu","Tap it again to go back":"Toca outra vez para voltares","Play the intro":"Ver a introdução",Skip:"Saltar","A cozy and relaxing puzzle game with arrows":"Um jogo de puzzle aconchegante e relaxante com setas","Created by Miguel Lima":"Criado por Miguel Lima","Created by Hearthbound Games":"Criado por Hearthbound Games","We hope you can enjoy...":"Esperamos que possas desfrutar...","and relax with our game":"e relaxar com o nosso jogo","We present to you:":"Apresentamos-te:","Co-op test: big boards":"Teste cooperativo: tabuleiros grandes","Same test, each board three times the size.":"O mesmo teste, com cada tabuleiro três vezes maior.","Temporary. You control all four boards.":"Temporário. Controlas os quatro tabuleiros.","Co-op test: clear all four boards. Use the arrows at the edges to switch boards.":"Teste cooperativo: limpa os quatro tabuleiros. Usa as setas nas margens para mudar de tabuleiro.","Wait: a sniper is coming in.":"Espera: vem aí um sniper.","A sniper is coming in!":"Vem aí um sniper!","Co-op test":"Teste cooperativo","Twins leave together. Both paths must be clear.":"As gémeas saem juntas. Os dois caminhos têm de estar livres.","Compass arrows turn a quarter each time something leaves.":"As setas bússola rodam um quarto de volta sempre que algo sai.","Moon arrows are asleep. Send the star arrow away to wake them.":"As setas lua estão a dormir. Faz sair a seta estrela para as acordares.","Mirrors turn an arrow on its way out. Follow the new path.":"Os espelhos viram a seta ao sair. Segue o novo caminho.","Patient arrows show a number. They can leave after that many launches.":"As setas pacientes mostram um número. Podem sair ao fim desses lançamentos.","Ghost arrows swap form on every launch. Play them only when solid.":"As setas fantasma mudam de forma a cada lançamento. Joga-as só quando estão sólidas.","Phase arrows can slip through one blocked tile on their way out.":"As setas atravessadoras conseguem atravessar uma casa ocupada ao sair.","Play this arrow before its count runs out, or it gets a red card.":"Joga esta seta antes de a contagem acabar, ou leva cartão vermelho.","Reverse arrows swap their tip to the other end on every launch.":"As setas inversas trocam a ponta para a outra extremidade a cada lançamento.","Ice can trap arrows. Hit a frozen arrow with another arrow to free it.":"O gelo pode prender setas. Acerta numa seta congelada com outra para a libertares.","Flowers block arrows. Each launch, a bee carries one away.":"As flores bloqueiam as setas. A cada lançamento, uma abelha leva uma.","Burning tiles stop arrows for a few launches. Wait, or find another way.":"As casas a arder travam as setas durante alguns lançamentos. Espera, ou procura outro caminho.","Wind can spin arrows around their tails when there is room.":"O vento pode rodar as setas à volta da cauda, quando há espaço.","Get every arrow off the board":"Tira todas as setas do tabuleiro","The goal of the game is to make every arrow leave the board. An arrow leaves the way it points, so its path must be clear. Hitting another arrow costs a life.":"O objetivo do jogo é fazer sair todas as setas do tabuleiro. Uma seta sai na direção para onde aponta, por isso o caminho tem de estar livre. Acertar noutra seta custa uma vida.","Tap an arrow and it leaves the way it points":"Toca numa seta e ela sai na direção para onde aponta","If another arrow is in the way, it bounces back":"Se houver outra seta no caminho, ressalta","So clear the way first":"Por isso, liberta primeiro o caminho","Now it can leave too":"Agora também pode sair","All arrows gone: board cleared!":"Saíram todas: tabuleiro limpo!","Twins share a colour and a letter. They leave together, so both paths must be clear.":"As gémeas têm a mesma cor e letra. Saem juntas, por isso os dois caminhos têm de estar livres.","One twin is blocked, so neither can go":"Uma gémea está bloqueada, por isso nenhuma sai","Clear the way first":"Primeiro, liberta o caminho","Now both leave together":"Agora saem as duas juntas","A compass arrow turns a quarter clockwise every time another arrow leaves.":"Uma seta bússola roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai outra seta.","It points at another arrow":"Aponta para outra seta","Each launch turns it a quarter":"Cada lançamento roda-a um quarto de volta","Now it has a clear way out":"Agora tem o caminho livre","Moon and star":"Lua e estrela","A moon arrow sleeps until the star arrow with the same number leaves. Tapping it early costs nothing.":"Uma seta lua dorme até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.","The moon arrow is asleep":"A seta lua está a dormir","Send its star arrow away":"Faz sair a sua seta estrela","Now it wakes and can leave":"Agora acorda e pode sair","A mirro
