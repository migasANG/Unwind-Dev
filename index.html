:root{
--ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
--display:"Fredoka","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
.scenebg{position:fixed;inset:0;overflow:hidden}
.scenebg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenebg.baking *{animation:none!important}
.scenebg svg.mover{will-change:transform,opacity}
.scenebg.pending{opacity:.001;pointer-events:none}

es, espera.","Rocks block your way. Whirlpools spin you off in a random direction. Barrels hold an extra life or an extra flare. Sailing off the edge of the map costs a life. Serpents that come close spot you and hunt you, so keep moving.":"As rochas bloqueiam o caminho. Os remoinhos atiram-te numa direção ao acaso. Os barris têm uma vida extra ou um sinalizador extra. Sair pela borda do mapa custa uma vida. As serpentes que chegam perto veem-te e perseguem-te, por isso não pares.","On Hard, tall rocks stand in the sea. They block the boat, and they also block the light, for the keeper and for the captain. Look around them.":"No Difícil, há rochas altas no mar. Bloqueiam o barco, e também a luz, para o faroleiro e para o capitão. Contorna-as.","The wind direction is shown in the top left, and it can turn. With your sail up, a wave that goes with the wind carries you two tiles in one move, and against the wind you do not move. Side winds change nothing. Lower the sail to ignore the wind.":"A direção do vento aparece no canto superior esquerdo, e pode mudar. Com a vela içada, uma onda a favor do vento leva-te duas casas numa só jogada, e contra o vento não te mexes. O vento de lado não muda nada. Recolhe a vela para ignorar o vento.","After every shine the light goes out. On the keeper's next turn, press Rekindle the light: that round stays dark, and the light works again the round after.":"Depois de cada vez que ilumina, a luz apaga-se. No turno seguinte do faroleiro, carrega em Reacender a luz: essa ronda fica às escuras, e a luz volta a funcionar na ronda a seguir.","No resting":"Sem descanso","On Hard the captain cannot wait two rounds in a row. And serpents are faster: they move two tiles in a straight line.":"No Difícil o capitão não pode esperar duas rondas seguidas. E as serpentes são mais rápidas: andam duas casas em linha reta.","Guiding Light":"Luz Guia","Guiding Light room":"Sala Luz Guia","Lighthouse keeper":"Faroleiro","Boat captain":"Capitão do barco"," oltar ao menu","Back to the room":"Voltar à sala","Waiting for your partner…":"À espera do teu parceiro…","Leave this game?":"Sair deste jogo?","Your partner will be left alone at sea.":"O teu parceiro fica sozinho no mar.","This map will be lost.":"Este mapa vai perder-se.","Keep playing":"Continuar a jogar",Leave:"Sair","Leave the game":"Sair do jogo","How to play":"Como jogar","A game for two. One of you keeps the lighthouse, the other sails a little boat home through a dark, foggy sea. The keeper's beam is the only light out there.":"Um jogo para dois. Um de vocês é o faroleiro, o outro leva um pequeno barco para casa por um mar escuro e cheio de nevoeiro. A luz do farol é a única que há lá fora.","A new map is made every game":"Cada jogo tem um mapa novo","Tall rocks, wind and sail, a faulty lamp and faster serpents":"Rochas altas, vento e vela, uma lâmpada avariada e serpentes mais rápidas","Rocks, whirlpools, barrels and serpents":"Rochas, remoinhos, barris e serpentes","Each of you on your own phone. Host a room and send your partner the code.":"Cada um no seu telemóvel. Cria uma sala e envia o código ao teu parceiro.","Play on one device":"Jogar num só dispositivo","Pass the phone between turns. No peeking!":"Passem o telemóvel entre turnos. Nada de espreitar!","The keeper":"O faroleiro","Shine the light, find the boat, hold back the serpents.":"Ilumina o mar, encontra o barco, trava as serpentes.","The captain":"O capitão","Catch waves, dodge danger, sail home.":"Apanha ondas, foge do perigo, navega até casa.","Hard mode":"Modo difícil","Tall rocks, wind and sail, the faulty lamp.":"Rochas altas, vento e vela, a lâmpada avariada.","The sea is dark and foggy. Your partner's boat is somewhere out there, and you cannot see it. Your job is to light the way so the boat can reach the lighthouse in the middle.":"O mar está escuro e cheio de nevoeiro. O barco do teu parceiro anda por aí, e tu não o vês. A tua tarefa é iluminar o caminho para o barco chegar ao farol, no meio do mapa.","Aim and shine":"Apontar e iluminar","Each turn, tap the sea to aim the beam, then press Shine. The beam crosses the whole map. Only what it lights is visible to you.":"Em cada turno, toca no mar para apontar o feixe e carrega em Iluminar. O feixe atravessa o mapa todo. Só vês o que ele ilumina.","Find the boat":"Encontra o barco","You only see the boat when the beam is on it. When your light touches the boat or a tile next to it, the captain sees the whole lit path to the lighthouse.":"Só vês o barco quando o feixe está em cima dele. Quando a tua luz toca no barco ou numa casa ao lado, o capitão vê todo o caminho iluminado até ao farol.","Hold back the serpents":"Trava as serpentes","Sea serpents roam in the fog and bite the boat. A serpent caught in your light dives and cannot move this round. Bubbles show where it is.":"As serpentes do mar andam pelo nevoeiro e mordem o barco. Uma serpente apanhada pela tua luz mergulha e não se mexe nesta ronda. As bolhas mostram onde está.","Light the way, or guard it?":"Iluminar o caminho, ou guardá-lo?","Every turn is a choice: search for the boat, show it a safe path, or pin down a serpent that is getting close. Talk to each other!":"Cada turno é uma escolha: procurar o barco, mostrar-lhe um caminho seguro, ou travar uma serpente que se aproxima. Falem um com o outro!","You only see the tiles around your boat. Somewhere in the dark is the lighthouse in the middle of the map. Stop next to it to win.":"Só vês as casas à volta do teu barco. Algures no escuro está o farol, no meio do mapa. Pára ao lado dele para ganhar.","Catch a wave":"Apanha uma onda","Tap a wave on or next to your boat: it carries the boat one tile its way. Waves change every round. If none goes your way, wait.":"Toca numa onda por baixo ou ao lado do teu barco: ela leva o barco uma casa na sua direção. As ondas mudam em cada ronda. Se nenhuma for para onde queres, espera.","Follow the light":"Segue a luz","When the keeper's beam touches wn: 1 tile":"Vela recolhida: 1 casa",Roles:"Papéis","Roles · tap both to swap":"Papéis · toca nos dois para trocar",Free:"Livre",Game:"Jogo","Co-op boards or Guiding Light":"Tabuleiros cooperativos ou Luz Guia","Co-op boards":"Tabuleiros cooperativos",Lives:"Vidas","The boat reaches the lighthouse":"O barco chega ao farol","It is not your turn yet.":"Ainda não é a tua vez.","That move is not allowed.":"Essa jogada não é permitida.","Your partner left":"O teu parceiro saiu","A game for two: one keeps the lighthouse, the other sails home through the fog.":"Um jogo para dois: um é o faroleiro, o outro navega até casa pelo nevoeiro.","The lighthouse at night: slow, warm piano over the sea":"O farol à noite: piano lento e quente sobre o mar",Intro:"Introdução","A nest! A bird that slides into it rests there. Stop the bird in the nest, then steer it onto the slingshot.":"Um ninho! Um pássaro que deslize para lá fica a descansar. Para o pássaro no ninho e depois leva-o até à fisga.","Three boards and three birds. Some birds are only in the way, and one nest keeps a bird where you need it.":"Três tabuleiros e três pássaros. Alguns pássaros só estorvam, e um ninho guarda um pássaro onde precisas dele.","Push birds onto the slingshot with arrows, then throw them. A thrown bird breaks the first wooden wall or arrow it hits. Nests stop birds, but never let an arrow hit an empty one. Clear every arrow to win.":"Empurra os pássaros para a fisga com as setas e depois atira-os. Um pássaro atirado parte a primeira parede de madeira ou seta em que bater. Os ninhos param os pássaros, mas nunca deixes uma seta acertar num ninho vazio. Limpa todas as setas para ganhar.",Coast:"Costa","Moonlit Coast":"Costa ao Luar","Night coast: a gentle harp lullaby by the sea":"Costa à noite: uma canção de embalar suave em harpa, junto ao mar","The bird rests in the nest.":"O pássaro descansa no ninho.","The bird rests in the nest. Never let an arrow hit an empty nest: the eggs would break.":"O pássaro descansa no ninho. Nunca deixes uma seta acertar num ninho vazio: os ovos partiam-se.","Own goal! That costs a life. The ball goes back to where it was kicked from.":"Autogolo! Custa uma vida. A bola volta ao sítio de onde foi chutada.","Out! That costs a life. The ball goes back to where it was kicked from.":"Fora! Custa uma vida. A bola volta ao sítio de onde foi chutada.","The eggs broke!":"Os ovos partiram-se!","An arrow hit an empty nest. Rest a bird in the nest first, or keep arrows away from it.":"Uma seta acertou num ninho vazio. Põe primeiro um pássaro a descansar no ninho, ou mantém as setas longe dele.","Nests and eggs":"Ninhos e ovos","A bird that slides into a nest rests there, like a stop sign, until an arrow pushes it on. A bird that slides in pushes the resting bird away and takes its place. A nest also blocks arrows: if an arrow hits an empty nest, the eggs break and the level is lost.":"Um pássaro que desliza para um ninho fica lá a descansar, como um sinal de stop, até uma seta o empurrar. Um pássaro que entra empurra o que está a descansar e fica no lugar dele. O ninho também trava as setas: se uma seta acertar num ninho vazio, os ovos partem-se e perdes o nível.","A bird that slides into a nest rests there until an arrow pushes it on, and a bird that slides in takes the resting bird's place. Nests block arrows: an arrow that hits an empty nest breaks the eggs and loses the level.":"Um pássaro que desliza para um ninho fica lá até uma seta o empurrar, e um pássaro que entra fica no lugar do que estava a descansar. Os ninhos travam as setas: uma seta que acerte num ninho vazio parte os ovos e perdes o nível.","A bird that reaches a nest rests there":"Um pássaro que chega a um ninho fica lá a descansar","A new bird takes its place and pushes it on":"Um pássaro novo fica no lugar dele e empurra-o","An arrow pushes the resting bird away":"Uma seta empurra o pássaro que descansa","Never let an arrow hit an empty nest":"Nunca deixes uma seta acertar num ninho vazio","Tap this message to go back to an earlier line, or to watch how it works again.":"Toca nesta mensagem para voltares a um verso anterior, ou para veres outra vez como funciona.","The video for letters, slots and compass arrows.":"O vídeo das letras, dos espaços e das setas bússola.",Unwind:"Unwind","No winning moves left":"Sem jogadas vencedoras","This line can no longer be written. Try it again: the lines you have already written stay written.":"Este verso já não pode ser escrito. Tenta outra vez: os versos que já escreveste ficam escritos.","Try this line again":"Tentar este verso outra vez","A thrown bird also breaks the first arrow it hits, then drops on the tile before it. Breaking an arrow is not a launch. Use it to free arrows that block each other.":"Um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Partir uma seta não conta como lançamento. Usa isto para soltar setas que se bloqueiam uma à outra.","A thrown bird also breaks the first arrow it hits, then drops on the tile before it. It is not a launch. A bird pushed by an arrow breaks nothing.":"Um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Não conta como lançamento. Um pássaro empurrado por uma seta não parte nada.","A ghost guards the way. Throw while it is see-through, and the bird flies straight past it.":"Um fantasma guarda o caminho. Atira enquanto ele está transparente, e o pássaro passa-lhe a direito.","Three boards and three birds. Some birds are only in the way.":"Três tabuleiros e três pássaros. Alguns pássaros só estão a atrapalhar.","Own goal! That costs a life. The ball goes back to its spot.":"Autogolo! Custa uma vida. A bola volta ao seu lugar.","Out! That costs a life. The ball goes back to its spot.":"Fora! Custa uma vida. A bola volta ao seu lugar.","Only a bird thrown from the slingshot can break wood.":"Só um pássaro atirado da fisga consegue partir madeira.","A thrown bird breaks the first arrow it hits.":"Um pássaro atirado parte a primeira seta em que acertar.","One wall blocks the slingshot itself. A bird pushed by an arrow cannot break wood: only a bird thrown from the slingshot can.":"Uma parede bloqueia a própria fisga. Um pássaro empurrado por uma seta não parte madeira: só um pássaro atirado da fisga consegue.","A thrown bird breaks the first arrow it hits. Birds can slide to other boards.":"Um pássaro atirado parte a primeira seta em que acertar. Os pássaros podem deslizar para outros tabuleiros.","Push birds onto the slingshot with arrows, then throw them. A thrown bird breaks the first wooden wall or arrow it hits. Clear every arrow to win.":"Empurra pássaros para a fisga com setas e depois atira-os. Um pássaro atirado parte a primeira parede de madeira ou seta em que acertar. Tira todas as setas para ganhar.","Bigger pitches. The ball starts in attack, but the way to goal begins back in midfield.":"Campos maiores. A bola começa no ataque, mas o caminho para a baliza começa no meio-campo.","Five big boards. Switch lanes twice, and mind your own goal.":"Cinco tabuleiros grandes. Muda de faixa duas vezes e cuidado com a tua baliza.","Poems of the sea":"Poemas do mar","Poem complete!":"Poema completo!","Show me a move":"Mostra-me uma jogada","One hint for this line.":"Uma dica para este verso.","No hints left on this line.":"Já não há dicas para este verso.","Go back to an earlier line":"Voltar a um verso anterior","The lines you have written stay written. Once you finish it, you come back here.":"Os versos que já escreveste ficam escritos. Quando o acabares, voltas aqui.","No winning moves are left on this line.":"Já não há jogadas vencedoras neste verso.","Write a poem one line at a time. Compass arrows push the letters sideways, and letters with nothing under them fall. If a line can no longer be finished, it is lost, and you try that line again. The hint button can take you back to an earlier line.":"Escreve um poema um verso de cada vez. As setas bússola empurram as letras para o lado, e as letras sem nada por baixo caem. Se um verso já não puder ser acabado, perdes, e tentas esse verso outra vez. O botão de dica pode levar-te a um verso anterior.","The Poem":"O Poema",Matchday:"Dia de Jogo","Fowl Play":"Penas Eriçadas","Kick the ball into the goal on the right. The goal on the left is your own.":"Chuta a bola para a baliza da direita. A baliza da esquerda é a tua.","Red cards that run out stay on the pitch for good. Clear the way in time.":"Os cartões vermelhos que acabam ficam em campo para sempre. Abre caminho a tempo.","Five boards. Sometimes the way forward starts by going back.":"Cinco tabuleiros. Às vezes, para avançar, é preciso recuar primeiro.","Push the bird onto the slingshot, then throw it at the wooden wall.":"Empurra o pássaro para a fisga e depois atira-o contra a parede de madeira.","A thrown bird now breaks the first arrow it hits. Birds can slide to other boards.":"Agora um pássaro atirado parte a primeira seta em que acertar. Os pássaros podem deslizar para outros tabuleiros.","Three boards and two birds. One wall is in the way of the slingshot itself.":"Três tabuleiros e dois pássaros. Há uma parede no caminho da própria fisga.","Push the letters into their slots to write a line of the poem.":"Empurra as letras para os seus espaços para escrever um verso do poema.","Solo levels on several boards at once. You play every board, and twin-shared and sniper arrows link them.":"Níveis a solo em vários tabuleiros ao mesmo tempo. Jogas em todos, e as setas gémeas partilhadas e atiradoras ligam-nos.","A football and a row of boards. An arrow that hits the ball kicks it. Score in the goal on the right; the left one is your own. Basic and red card arrows only, and red cards that run out stay for good.":"Uma bola e uma fila de tabuleiros. Uma seta que acerta na bola chuta-a. Marca na baliza da direita; a da esquerda é a tua. Só setas normais e de cartão vermelho, e os cartões vermelhos que acabam ficam para sempre.","Push birds onto the slingshot with arrows, then throw them to break wooden walls. From level 2, a thrown bird also breaks the first arrow it hits. Clear every arrow to win.":"Empurra pássaros para a fisga com setas e depois atira-os para partir paredes de madeira. A partir do nível 2, um pássaro atirado também parte a primeira seta em que acertar. Tira todas as setas para ganhar.","One level, one board for each line. Compass arrows push the letters sideways, and letters with nothing under them fall. Fill every slot to write the line, and read the whole poem at the end.":"Um nível, um tabuleiro por verso. As setas bússola empurram as letras para o lado, e as letras sem nada por baixo caem. Preenche todos os espaços para escrever o verso, e lê o poema inteiro no fim.","This line is written.":"Este verso está escrito.","Line 2 of 4: fill every slot to write it.":"Verso 2 de 4: preenche todos os espaços para o escrever.","Line 3 of 4: fill every slot to write it.":"Verso 3 de 4: preenche todos os espaços para o escrever.","Line 4 of 4: fill every slot to write it.":"Verso 4 de 4: preenche todos os espaços para o escrever.","Letters only move sideways.":"As letras só se mexem para os lados.","Something is in the way: it cannot move there.":"Há algo no caminho: não se pode mexer para ali.","Own goal! That costs a life. The ball goes back to the centre spot.":"Autogolo! Custa uma vida. A bola volta ao centro.","Out! That costs a life. The ball goes back to the centre spot.":"Fora! Custa uma vida. A bola volta ao centro.","The bird flew away.":"O pássaro voou para longe.","The bird is on the slingshot. Tap the slingshot to throw it.":"O pássaro está na fisga. Toca na fisga para o atirar.","Push a bird onto the slingshot with an arrow.":"Empurra um pássaro para a fisga com uma seta.","Choose where to throw the bird.":"Escolhe para onde atirar o pássaro.","Something is right in front of it.":"Há algo mesmo à frente.","No moves left: these letters cannot reach their slots any more.":"Sem jogadas: estas letras já não chegam aos seus espaços.","No moves left: the ball can no longer reach the goal.":"Sem jogadas: a bola já não consegue chegar à baliza.","No moves left: some arrows can never leave now.":"Sem jogadas: há setas que já nunca vão poder sair.","A wooden wall is in the way. A bird thrown from the slingshot can break it.":"Há uma parede de madeira no caminho. Um pássaro atirado da fisga consegue parti-la.","Your goal":"A tua baliza","Score here":"Marca aqui","GOAL!":"GOLO!",Continue:"Continuar","No moves left":"Sem jogadas","The ball can no longer reach the goal from here. Try a different order.":"Daqui a bola já não chega à baliza. Experimenta outra ordem.","These letters can no longer reach their slots. Try a different order.":"Estas letras já não chegam aos seus espaços. Experimenta outra ordem.","Some arrows can never leave now. Try a different order.":"Há setas que já nunca vão poder sair. Experimenta outra ordem.","Read the poem again":"Ler o poema outra vez","The whole poem, with its music.":"O poema inteiro, com a sua música.","Boarding Up specials":"Especiais de Tabuleiros em Grupo","Matchday: the ball":"Dia de Jogo: a bola","Fowl Play: birds and the slingshot":"Penas Eriçadas: pássaros e a fisga","Birds that break arrows":"Pássaros que partem setas","The Poem: letters and slots":"O Poema: letras e espaços","An arrow that hits the ball kicks it and stays put. The ball rolls until something stops it, even across boards. Score on the right; the left goal is yours. Goalkeepers never move, and run-out red cards stay for good.":"Uma seta que acerta na bola chuta-a e fica onde está. A bola rola até algo a parar, mesmo entre tabuleiros. Marca à direita; a baliza da esquerda é a tua. Os guarda-redes nunca se mexem, e os cartões vermelhos que acabam ficam para sempre.","Arrows push birds, which slide until something stops them, even onto other boards. A bird that slides onto the slingshot sits on it: tap the slingshot, then a direction, to throw it. It breaks the first wooden wall it meets.":"As setas empurram pássaros, que deslizam até algo os parar, mesmo para outros tabuleiros. Um pássaro que desliza para a fisga fica lá: toca na fisga e depois numa direção para o atirar. Parte a primeira parede de madeira que encontrar.","From Fowl Play 2 on, a thrown bird also breaks the first arrow it hits, then drops on the tile before it. It is not a launch.":"A partir de Penas Eriçadas 2, um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Não conta como lançamento.","Fill every slot with its letter to write a line. Letters fall when nothing holds them up, and a compass arrow that hits a letter pushes it one tile sideways.":"Preenche cada espaço com a sua letra para escrever um verso. As letras caem quando nada as segura, e uma seta bússola que acerta numa letra empurra-a uma casa para o lado.","Slingshot and birds":"Fisga e pássaros","Birds break arrows":"Os pássaros partem setas","An arrow that hits the ball kicks it and stays. The ball rolls until something stops it, even onto the next board. Score in the goal on the RIGHT: the left one is yours, and an own goal or a ball off the pitch costs a life. Goalkeepers never move, and red cards that run out stay for good.":"Uma seta que acerta na bola chuta-a e fica. A bola rola até algo a parar, mesmo para o tabuleiro seguinte. Marca na baliza da DIREITA: a da esquerda é a tua, e um autogolo ou uma bola fora custa uma vida. Os guarda-redes nunca se mexem, e os cartões vermelhos que acabam ficam para sempre.","An arrow that hits a bird pushes it, and it slides until something stops it. A bird that slides onto the slingshot sits on it. Tap the slingshot, then a direction, to throw the bird. It breaks the first wooden wall it meets. Clear every arrow to win.":"Uma seta que acerta num pássaro empurra-o, e ele desliza até algo o parar. Um pássaro que desliza para a fisga fica lá. Toca na fisga e depois numa direção para atirar o pássaro. Parte a primeira parede de madeira que encontrar. Tira todas as setas para ganhar.","From Fowl Play 2 on, a thrown bird also breaks the first arrow it hits, then drops on the tile before it. Breaking an arrow is not a launch. Use it to free arrows that block each other.":"A partir de Penas Eriçadas 2, um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Partir uma seta não conta como lançamento. Usa isto para soltar setas que se bloqueiam uma à outra.","Fill every slot with its letter to write a line. Letters with nothing under them fall. A compass arrow that hits a letter pushes it one tile sideways and stays. Compass arrows still turn each time an arrow leaves. Finish a board to read the line, then the next board opens.":"Preenche cada espaço com a sua letra para escrever um verso. As letras sem nada por baixo caem. Uma seta bússola que acerta numa letra empurra-a uma casa para o lado e fica. As setas bússola continuam a rodar sempre que sai uma seta. Acaba um tabuleiro para ler o verso, e abre-se o seguinte.","Clear the ball's way first":"Primeiro abre caminho à bola","An arrow that hits the ball kicks it":"Uma seta que acerta na bola chuta-a","Goal! Always score on the right":"Golo! Marca sempre à direita","An arrow pushes the bird onto the slingshot":"Uma seta empurra o pássaro para a fisga","Tap the slingshot to aim":"Toca na fisga para apontar","The bird breaks the wooden wall":"O pássaro parte a parede de madeira","Arrows push birds out of the way":"As setas empurram os pássaros para fora do caminho","Now the arrow can leave":"Agora a seta pode sair","These two arrows block each other":"Estas duas setas bloqueiam-se uma à outra","Aim the slingshot at one of them":"Aponta a fisga a uma delas","The bird breaks the arrow it hits":"O pássaro parte a seta em que acerta","Now the other one can leave":"Agora a outra pode sair","An arrow leaves, so the letter falls into its slot":"Sai uma seta, por isso a letra cai no seu espaço","A compass arrow pushes a letter one tile sideways":"Uma seta bússola empurra uma letra uma casa para o lado","Fill every slot to write the line":"Preenche todos os espaços para escrever o verso",Calm:"Calmo",Hard:"Difícil",Timed:"Cronometrado",Seasons:"Estações",Winter:"Inverno",Spring:"Primavera",Summer:"Verão",Autumn:"Outono",Dawn:"Amanhecer",Morning:"Manhã",Noon:"Meio-dia",Dusk:"Anoitecer",Night:"Noite",Default:"Automático",Background:"Fundo","Change it any time. Your board stays as it is.":"Muda quando quiseres. O teu tabuleiro fica como está.",Harder:"Mais difícil","Open Water":"Águas Abertas","Growing the map":"A criar o mapa","Planting arrows":"A plantar setas","Choosing the best layout":"A escolher o melhor tabuleiro","Painting the board":"A pintar o tabuleiro","Almost ready":"Quase pronto","Today's puzzle":"Puzzle de hoje","No lives to lose out here.":"Aqui não há vidas a perder.","Hard boards: two lives, no hints, and combo arrows that mix up to 3 effects.":"Tabuleiros difíceis: duas vidas, sem dicas e setas combo que juntam até 3 efeitos.","Clear the board before the time runs out.":"Limpa o tabuleiro antes de o tempo acabar.","1 life left":"1 vida restante","No lives":"Sem vidas","Free play":"Jogo livre","Free play, no lives to lose":"Jogo livre, sem vidas a perder",Hint:"Dica",Rewind:"Voltar",Restart:"Reiniciar",Guide:"Guia",Levels:"Níveis","Red cards are blocking the board. Rewind and play them in time.":"Os cartões vermelhos estão a bloquear o tabuleiro. Volta atrás e joga-os a tempo.","Nothing can move. Rewind one step.":"Nada se pode mexer. Volta uma jogada atrás.","This board cannot clear from here. Rewind a step or two.":"Daqui já não dá para limpar o tabuleiro. Volta uma ou duas jogadas atrás.","Spectacular!":"Espetacular!","Amazing!":"Incrível!","Great job!":"Muito bem!","Wonderful!":"Maravilha!","Lovely!":"Que bonito!","Beautiful!":"Lindo!","Brilliant!":"Brilhante!","Nice one!":"Boa!","Well done!":"Bem feito!","Superb!":"Fantástico!","20% chance per launch that arrows freeze":"20% de hipótese por lançamento de as setas congelarem","25% chance per launch that tiles burn":"25% de hipótese por lançamento de as casas arderem","50% chance per launch of wind":"50% de hipótese de vento por lançamento","Freeze: 20%":"Gelo: 20%","Fire: 25%":"Fogo: 25%","Wind: 50%":"Vento: 50%","Flowers remaining":"Flores restantes","After each launch, there is a 20% chance that 1 to 5 arrows freeze. They thaw after 3 to 5 launches, or hit them with another arrow.":"Depois de cada lançamento, há 20% de hipótese de 1 a 5 setas congelarem. Derretem ao fim de 3 a 5 lançamentos, ou acerta-lhes com outra seta.","Flowers block arrows, and hitting one costs a life. After each launch, a bee carries one away.":"As flores bloqueiam as setas, e acertar numa custa uma vida. Depois de cada lançamento, uma abelha leva uma.","After each launch, there is a 25% chance that 1 to 5 tiles burn for 2 to 4 launches. Hitting fire costs a life.":"Depois de cada lançamento, há 25% de hipótese de 1 a 5 casas arderem durante 2 a 4 lançamentos. Acertar no fogo custa uma vida.","After each launch, there is a 50% chance of wind. Arrows may then spin around their tails if there is room.":"Depois de cada lançamento, há 50% de hipótese de vento. As setas podem rodar à volta da cauda, se houver espaço.","Perfect!":"Perfeito!","All clear":"Tudo limpo","You never lost a life.":"Não perdeste nenhuma vida.","Not one collision. Lovely.":"Nem uma colisão. Lindo.","Smooth as still water.":"Suave como água parada.","Another calm stretch of water.":"Mais um trecho de água calma.","One small bump on the way.":"Um pequeno toque pelo caminho.","Your first clean run":"A tua primeira partida sem erros","Your first clean run for this map type":"A tua primeira partida sem erros neste tipo de mapa","Runs with mistakes do not count":"Partidas com erros não contam","Clear it with no mistakes to set one":"Termina sem erros para criares um","New personal best!":"Novo recorde pessoal!","Personal best":"Recorde pessoal","Personal bests":"Recordes pessoais","Next level":"Próximo nível","Onto the Open Waters":"Rumo às Águas Abertas","Keep drifting":"Continuar a navegar","Back to levels":"Voltar aos níveis",Time:"Tempo",Launches:"Lançamentos","Hints used":"Dicas usadas","Play my tune":"Tocar a minha música","Play again":"Jogar de novo","Time's up":"Acabou o tempo","Out of lives":"Sem vidas","The board was nearly there. Take a breath and go again.":"Estava quase. Respira fundo e tenta outra vez.","Take a moment, then try this board again.":"Faz uma pausa e tenta este tabuleiro outra vez.","Try again":"Tentar de novo","Choose another level":"Escolher outro nível","First steps":"Primeiros passos",Twins:"Gémeas",Compass:"Bússola",Sleepers:"Adormecidas",Mirrors:"Espelhos",Patient:"Pacientes",Ghost:"Fantasmas",Phase:"Atravessadoras","Red card":"Cartão vermelho",Reverse:"Inversas","Everything together":"Tudo junto","A day on the lake":"Um dia no lago",Completed:"Concluído","Perfect, no lives lost":"Perfeito, sem perder vidas","20% chance per launch that arrows freeze. Hit them to free them.":"20% de hipótese por lançamento de as setas congelarem. Acerta-lhes para as libertares.","Flowers block the way. Each launch, a bee takes one.":"As flores bloqueiam o caminho. A cada lançamento, uma abelha leva uma.","25% chance per launch that tiles catch fire.":"25% de hipótese por lançamento de as casas pegarem fogo.","50% chance per launch that wind spins arrows.":"50% de hipótese por lançamento de o vento rodar setas.","Two lives, no hints, and combo arrows that mix up to 3 effects.":"Duas vidas, sem dicas e setas combo que juntam até 3 efeitos.","Beat the clock on every board. Three lives.":"Vence o relógio em cada tabuleiro. Três vidas.","Cleared today. Play it again any time.":"Concluído hoje. Joga de novo quando quiseres.","One new board each day.":"Um tabuleiro novo por dia.","2 lives, no hints, and combo arrows that mix up to 3 effects":"2 vidas, sem dicas e setas combo que juntam até 3 efeitos","Clear each board before the clock runs out":"Limpa cada tabuleiro antes de o tempo acabar","Season effects":"Efeitos das estações","Pick any number. Random uses 1 to 4 for each board.":"Escolhe quantos quiseres. Aleatório usa 1 a 4 em cada tabuleiro.",None:"Nenhum",Random:"Aleatório","You can also change it while playing.":"Também podes mudar durante o jogo.","Map size":"Tamanho do mapa","Bigger maps can be zoomed and moved around":"Nos mapas maiores podes aproximar e mover a vista","Play Open Waters":"Jogar em Águas Abertas","© 2026 Miguel Lima. All rights reserved.":"© 2026 Miguel Lima. Todos os direitos reservados.",Understood:"Entendido",Arrow:"Seta","Tap it to send it off the board. If something is in its way, it bounces back and costs a life.":"Toca para a enviar para fora do tabuleiro. Se houver algo no caminho, ressalta e custa uma vida.","Same colour and letter. They leave together, so both of their paths must be clear.":"A mesma cor e a mesma letra. Saem juntas, por isso os dois caminhos têm de estar livres.","Turns a quarter clockwise each time an arrow leaves. The wrong order can leave you stuck, so use Rewind.":"Roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai uma seta. A ordem errada pode deixar-te preso, por isso usa Voltar.","Moon arrow":"Seta lua","Star arrow":"Seta estrela","Asleep and dashed. It cannot move until the star arrow with the same number leaves. Tapping it early costs nothing.":"Adormecida e tracejada. Não se mexe até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.","When it leaves, it wakes the moon arrow with the same number, at the other end of its golden thread.":"Quando sai, acorda a seta lua com o mesmo número, na outra ponta do fio dourado.",Mirror:"Espelho","Not an arrow. It turns any arrow passing through by 90 degrees, so follow the new path.":"Não é uma seta. Roda 90 graus qualquer seta que passe por ele, por isso segue o novo caminho.","Patient arrow":"Seta paciente","Its number shows how many more launches it needs before it can leave. Tapping it early costs nothing.":"O número mostra quantos lançamentos faltam até poder sair. Tocar antes de tempo não custa nada.","Ghost arrow":"Seta fantasma","Swaps form after every launch. See-through as a ghost: it cannot be played, and other arrows pass through it. Solid: it plays and blocks like any arrow.":"Muda de forma depois de cada lançamento. Transparente: não pode ser jogada e as outras setas passam por ela. Sólida: joga e bloqueia como qualquer seta.","Reverse arrow":"Seta inversa","Orange. Its tip swaps to the other end after every launch, and the faint mark shows where it goes next. Play it when the end it points from has a clear way out.":"Cor de laranja. A ponta troca para a outra extremidade depois de cada lançamento, e a marca ténue mostra para onde vai a seguir. Joga-a quando a ponta tiver o caminho livre.","Phase arrow":"Seta atravessadora","Purple. Can slip through one occupied tile on its way out, whether an arrow, a flower or fire, but not two in a row.":"Roxa. Consegue atravessar uma casa ocupada ao sair, seja uma seta, uma flor ou fogo, mas não duas seguidas.","Red card arrow":"Seta de cartão vermelho","Play it before its count reaches zero. If not, it is sent off: it cannot move until only sent-off arrows remain, and it can block the rest. Rewind if that traps you.":"Joga-a antes de a contagem chegar a zero. Senão, é expulsa: não se mexe até só restarem setas expulsas, e pode bloquear as outras. Volta atrás se ficares preso.","Frozen arrow":"Seta congelada","Winter. It cannot move, and it blocks others. It thaws by itself after 3 to 5 launches, or hit it with another arrow to free it sooner, at no cost.":"Inverno. Não se mexe e bloqueia as outras. Derrete sozinha ao fim de 3 a 5 lançamentos, ou acerta-lhe com outra seta para a libertares mais cedo, sem custos.","Burning tile":"Casa a arder","Summer. Blocks arrows for 2 to 4 launches. Hitting it costs a life.":"Verão. Bloqueia as setas durante 2 a 4 lançamentos. Acertar nela custa uma vida.","Flower and bee":"Flor e abelha","Spring. Flowers block arrows, and hitting one costs a life. After each launch, the bee carries its flower away.":"Primavera. As flores bloqueiam as setas, e acertar numa custa uma vida. Depois de cada lançamento, a abelha leva a sua flor.",Wind:"Vento","Autumn. Can spin an arrow fully around its tail if there is room. Short arrows spin most often, and more can turn as the board clears.":"Outono. Pode rodar uma seta à volta da cauda, se houver espaço. As setas curtas rodam mais vezes, e podem rodar mais à medida que o tabuleiro fica livre.","Arrow guide":"Guia das setas","On this board":"Neste tabuleiro","▶ Watch how it works":"▶ Ver como funciona","Music and sound":"Música e som",Settings:"Definições",Language:"Idioma",Music:"Música","Sound effects":"Efeitos sonoros",Theme:"Tema","Follow the level":"Seguir o nível","Matches the time of day or season":"Acompanha a hora do dia ou a estação do ano","Music is off":"Música desligada","Sound on for the full experience":"Liga o som para a experiência completa","Tap to begin":"Toca para começar","Puzzle board. Tap an arrow to send it off the board.":"Tabuleiro do puzzle. Toca numa seta para a enviar para fora do tabuleiro.","Music and sound settings":"Definições de música e som","Settings ":"Definições","Choose a background":"Escolher um fundo","Zoom in":"Aproximar","Zoom out":"Afastar","Show the whole board":"Mostrar o tabuleiro todo",Close:"Fechar","Tap an arrow to send it off the board. Get them all out to win.":"Toca numa seta para a enviar para fora do tabuleiro. Tira-as todas para ganhar.","Hit a frozen arrow with another arrow to open the way. It costs nothing.":"Acerta numa seta congelada com outra seta para abrires caminho. Não custa nada.",Next:"Próxima","Next play: the highlighted arrow.":"Próxima jogada: a seta destacada.","A play exists, but this board may not clear from here.":"Há uma jogada, mas daqui o tabuleiro pode não ficar limpo.","Next play: hit the ice with the highlighted arrow. It costs nothing.":"Próxima jogada: acerta no gelo com a seta destacada. Não custa nada.","Dead end: no play is possible.":"Sem saída: não há jogadas possíveis.","Test level: ice warning":"Nível de teste: aviso do gelo","Temporary. After 2 launches, only hitting the ice is possible.":"Temporário. Depois de 2 lançamentos, só é possível acertar no gelo.","Test level":"Nível de teste","Test level: play the two arrows on the left, then watch the message here.":"Nível de teste: joga as duas setas da esquerda e vê a mensagem aqui.","Arrows with several effects":"Setas com vários efeitos","In Hard, one arrow can carry up to 3 effects at once. Every one of its rules applies, so read all of its symbols.":"No modo Difícil, uma seta pode ter até 3 efeitos ao mesmo tempo. Aplicam-se todas as regras, por isso lê todos os símbolos.","Patient and reverse: it must wait 1 launch":"Paciente e inversa: tem de esperar 1 lançamento","One launch, and its tip also swaps ends":"Um lançamento, e a ponta também troca de lado","Both rules are met: it leaves the other way":"As duas regras cumpridas: sai pelo outro lado","A golden arrow! It can fly through anything.":"Uma seta dourada! Consegue atravessar tudo.","Test level: golden arrow":"Nível de teste: seta dourada","Temporary. After 1 launch, two arrows block each other and one turns golden.":"Temporário. Depois de 1 lançamento, duas setas bloqueiam-se e uma fica dourada.","Test level: play the arrow at the top to see the golden arrow.":"Nível de teste: joga a seta de cima para veres a seta dourada.","Golden arrow":"Seta dourada","Only appears if arrows truly block each other. It sparkles, hums and can fly through anything, so the board can always be cleared.":"Só aparece quando há setas que se bloqueiam mesmo umas às outras. Brilha, faz um som especial e atravessa tudo, por  burns out":"O fogo apaga-se","Now the way is clear":"Agora o caminho está livre","Spring. Flowers block arrows. After each launch, a bee carries one flower away.":"Primavera. As flores bloqueiam as setas. Depois de cada lançamento, uma abelha leva uma flor.","A flower blocks the way":"Uma flor bloqueia o caminho","After a launch, a bee takes it":"Depois de um lançamento, uma abelha leva-a","Autumn. Wind can spin an arrow around its tail when there is room, which can change everything.":"Outono. O vento pode rodar uma seta à volta da cauda quando há espaço, e isso pode mudar tudo.","This arrow is blocked":"Esta seta está bloqueada","A launch can bring a gust that spins an arrow":"Um lançamento pode trazer uma rajada que roda uma seta","Now it has a new way out":"Agora tem uma nova saída","First Light":"Primeira Luz","Still Water":"Água Parada","Lantern Hour":"Hora das Lanternas","Night Swim":"Mergulho Noturno",Snowfall:"Neve a Cair",Meadow:"Prado",Sandbar:"Banco de Areia","Amber Leaves":"Folhas de Âmbar","Rolling felt piano":"Piano suave","Playful wooden kalimba":"Kalimba de madeira brincalhona","Music box waltz":"Valsa de caixa de música","Slow, dreamy electric piano":"Piano elétrico lento e sonhador","Winter: a tiptoeing celesta dance":"Inverno: uma dança de celesta em bicos de pés","Spring: a cheerful ukulele and a whistled tune":"Primavera: um ukulele alegre e uma melodia assobiada","Summer: lazy bossa guitar":"Verão: guitarra de bossa preguiçosa","Autumn: warm cello and a slow waltz":"Outono: violoncelo quente e uma valsa lenta"},a={Level:"Nível",Hard:"Difícil",Timed:"Cronometrado",Winter:"Inverno",Spring:"Primavera",Summer:"Verão",Autumn:"Outono","Open Water":"Águas Abertas","Open Waters":"Águas Abertas"},i=[[/^Hint (\d+)$/,"Dica $1"],[/^(\d+) lives$/,"$1 vidas"],[/^(Small|Medium|Large) · Hard$/,function(e,a){return{Small:"Pequeno",Medium:"Médio",Large:"Grande"}[a]+" · Difícil"}],[/^Play again \((\d+)\/(\d+)\)$/,"Jogar outra vez ($1/$2)"],[/^(.+) left the game
