/* Layout: one full-screen sky. The board floats in it, arrows fly off the real screen edge, and a sun marks progress through the day. */
:root{
  --ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
  --display:"Fredoka","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
.scenebg{position:fixed;inset:0;overflow:hidden}
.scenebg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenebg.baking *{animation:none!important}
.scenebg svg.mover{will-change:transform,opacity}
.scenebg.pending{opacity:.001;pointer-events:none}
.scenebg{transition:opacity var(--bgfade,1.4s) ease-in-out;will-change:opacity}
.boardfade{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity var(--bgfade,1.4s) ease-in-out}

.otpdash{font-size:1.6rem;font-weight:800;padding:0 2px;flex:none}

.orejoin{background:#3fae6a;color:#fff;border-color:#3fae6a}
.sizes button[disabled]{opacity:.35;cursor:default}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideout{from{transform:none}to{transform:translateX(-100%)}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.sheet.closing{animation:fadeout .42s ease both;pointer-events:none}
.sheet.side.closing{animation:fadeout .34s ease both}
.sheet.side.closing .cardbox>.card{animation:none}
.smoke{animation:smoke 5s ease-in infinite}
.smoke.b{animation-delay:1.6s}.smoke.c{animation-delay:3.2s}

.rise{animation:rise 6s ease-in infinite}

@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translate(9px,-30px) scale(1.5);opacity:0}}

@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(8px,-7px);opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

@keyframes fade{from{opacity:0}to{opacity:1}}

    'An arrow that hits the ball kicks it and stays. The ball rolls until something stops it, even onto the next board. Score in the goal on the RIGHT: the left one is yours, and an own goal or a ball off the pitch costs a life. Goalkeepers never move, and red cards that run out stay for good.': 'Uma seta que acerta na bola chuta-a e fica. A bola rola até algo a parar, mesmo para o tabuleiro seguinte. Marca na baliza da DIREITA: a da esquerda é a tua, e um autogolo ou uma bola fora custa uma vida. Os guarda-redes nunca se mexem, e os cartões vermelhos que acabam ficam para sempre.',
    'An arrow that hits a bird pushes it, and it slides until something stops it. A bird that slides onto the slingshot sits on it. Tap the slingshot, then a direction, to throw the bird. It breaks the first wooden wall it meets. Clear every arrow to win.': 'Uma seta que acerta num pássaro empurra-o, e ele desliza até algo o parar. Um pássaro que desliza para a fisga fica lá. Toca na fisga e depois numa direção para atirar o pássaro. Parte a primeira parede de madeira que encontrar. Tira todas as setas para ganhar.',
    'From Woodland 2 on, a thrown bird also breaks the first arrow it hits, then drops on the tile before it. Breaking an arrow is not a launch. Use it to free arrows that block each other.': 'A partir do Bosque 2, um pássaro atirado também parte a primeira seta em que acertar e cai na casa antes dela. Partir uma seta não conta como lançamento. Usa isto para soltar setas que se bloqueiam uma à outra.',
    'Fill every slot with its letter to write a line. Letters with nothing under them fall. A compass arrow that hits a letter pushes it one tile sideways and stays. Compass arrows still turn each time an arrow leaves. Finish a board to read the line, then the next board opens.': 'Preenche cada espaço com a sua letra para escrever um verso. As letras sem nada por baixo caem. Uma seta bússola que acerta numa letra empurra-a uma casa para o lado e fica. As setas bússola continuam a rodar sempre que sai uma seta. Acaba um tabuleiro para ler o verso, e abre-se o seguinte.',

    'Completed': 'Concluído', 'Perfect, no lives lost': 'Perfeito, sem perder vidas', '20% chance per launch that arrows freeze. Hit them to free them.': '20% de hipótese por lançamento de as setas congelarem. Acerta-lhes para as libertares.', 'Flowers block the way. Each launch, a bee takes one.': 'As flores bloqueiam o caminho. A cada lançamento, uma abelha leva uma.', '25% chance per launch that tiles catch fire.': '25% de hipótese por lançamento de as casas pegarem fogo.', '50% chance per launch that wind spins arrows.': '50% de hipótese por lançamento de o vento rodar setas.',

    'Tap it to send it off the board. If something is in its way, it bounces back and costs a life.': 'Toca para a enviar para fora do tabuleiro. Se houver algo no caminho, ressalta e custa uma vida.',
    'Same colour and letter. They leave together, so both of their paths must be clear.': 'A mesma cor e a mesma letra. Saem juntas, por isso os dois caminhos têm de estar livres.',
    'Turns a quarter clockwise each time an arrow leaves. The wrong order can leave you stuck, so use Rewind.': 'Roda um quarto de volta no sentido dos ponteiros do relógio sempre que sai uma seta. A ordem errada pode deixar-te preso, por isso usa Voltar.',
    'Moon arrow': 'Seta lua', 'Star arrow': 'Seta estrela', 'Asleep and dashed. It cannot move until the star arrow with the same number leaves. Tapping it early costs nothing.': 'Adormecida e tracejada. Não se mexe até sair a seta estrela com o mesmo número. Tocar antes de tempo não custa nada.',
    'When it leaves, it wakes the moon arrow with the same number, at the other end of its golden thread.': 'Quando sai, acorda a seta lua com o mesmo número, na outra ponta do fio dourado.', 'Mirror': 'Espelho', 'Not an arrow. It turns any arrow passing through by 90 degrees, so follow the new path.': 'Não é uma seta. Roda 90 graus qualquer seta que passe por ele, por isso segue o novo caminho.',
    'Patient arrow': 'Seta paciente', 'Its number shows how many more launches it needs before it can leave. Tapping it early costs nothing.': 'O número mostra quantos lançamentos faltam até poder sair. Tocar antes de tempo não custa nada.', 'Ghost arrow': 'Seta fantasma',
    'Swaps form after every launch. See-through as a ghost: it cannot be played, and other arrows pass through it. Solid: it plays and blocks like any arrow.': 'Muda de forma depois de cada lançamento. Transparente: não pode ser jogada e as outras setas passam por ela. Sólida: joga e bloqueia como qualquer seta.',
    'Reverse arrow': 'Seta inversa', 'Orange. Its tip swaps to the other end after every launch, and the faint mark shows where it goes next. Play it when the end it points from has a clear way out.': 'Cor de laranja. A ponta troca para a outra extremidade depois de cada lançamento, e a marca ténue mostra para onde vai a seguir. Joga-a quando a ponta tiver o caminho livre.',
    'Phase arrow': 'Seta atravessadora', 'Purple. Can slip through one occupied tile on its way out, whether an arrow, a flower or fire, but not two in a row.': 'Roxa. Consegue atravessar uma casa ocupada ao sair, seja uma seta, uma flor ou fogo, mas não duas seguidas.',
    'Red card arrow': 'Seta de cartão vermelho', 'Play it before its count reaches zero. If not, it is sent off: it cannot move until only sent-off arrows remain, and it can block the rest. Rewind if that traps you.': 'Joga-a antes de a contagem chegar a zero. Senão, é expulsa: não se mexe até só restarem setas expulsas, e pode bloquear as outras. Volta atrás se ficares preso.',
    'Frozen arrow': 'Seta congelada', 'Winter. It cannot move, and it blocks others. It thaws by itself after 3 to 5 launches, or hit it with another arrow to free it sooner, at no cost.': 'Inverno. Não se mexe e bloqueia as outras. Derrete sozinha ao fim de 3 a 5 lançamentos, ou acerta-lhe com outra seta para a libertares mais cedo, sem custos.',
    'Burning tile': 'Casa a arder', 'Summer. Blocks arrows for 2 to 4 launches. Hitting it costs a life.': 'Verão. Bloqueia as setas durante 2 a 4 lançamentos. Acertar nela custa uma vida.', 'Flower and bee': 'Flor e abelha',
    'Spring. Flowers block arrows, and hitting one costs a life. After each launch, the bee carries its flower away.': 'Primavera. As flores bloqueiam as setas, e acertar numa custa uma vida. Depois de cada lançamento, a abelha leva a sua flor.', 'Wind': 'Vento',
    'Autumn. Can spin an arrow fully around its tail if there is room. Short arrows spin most often, and more can turn as the board clears.': 'Outono. Pode rodar uma seta à volta da cauda, se houver espaço. As setas curtas rodam mais vezes, e podem rodar mais à medida que o tabuleiro fica livre.',

    'Tap an arrow to send it off the board. Get them all out to win.': 'Toca numa seta para a enviar para fora do tabuleiro. Tira-as todas para ganhar.', 'Hit a frozen arrow with another arrow to open the way. It costs nothing.': 'Acerta numa seta congelada com outra seta para abrires caminho. Não custa nada.', 'Next': 'Próxima', 'Next play: the highlighted arrow.': 'Próxima jogada: a seta destacada.', 'A play exists, but this board may not clear from here.': 'Há uma jogada, mas daqui o tabuleiro pode não ficar limpo.', 'Next play: hit the ice with the highlighted arrow. It costs nothing.': 'Próxima jogada: acerta no gelo com a seta destacada. Não custa nada.', 'Dead end: no play is possible.': 'Sem saída: não há jogadas possíveis.', 'Test level: ice warning': 'Nível de teste: aviso do gelo', 'Temporary. After 2 launches, only hitting the ice is possible.': 'Temporário. Depois de 2 lançamentos, só é possível acertar no gelo.', 'Test level': 'Nível de teste', 'Test level: play the two arrows on the left, then watch the message here.': 'Nível de teste: joga as duas setas da esquerda e vê a mensagem aqui.', 'Arrows with several effects': 'Setas com vários efeitos', 'In Hard, one arrow can carry up to 3 effects at once. Every one of its rules applies, so read all of its symbols.': 'No modo Difícil, uma seta pode ter até 3 efeitos ao mesmo tempo. Aplicam-se todas as regras, por isso lê todos os símbolos.', 'Patient and reverse: it must wait 1 launch': 'Paciente e inversa: tem de esperar 1 lançamento', 'One launch, and its tip also swaps ends': 'Um lançamento, e a ponta também troca de lado', 'Both rules are met: it leaves the other way': 'As duas regras cumpridas: sai pelo outro lado', 'A golden arrow! It can fly through anything.': 'Uma seta dourada! Consegue atravessar tudo.', 'Test level: golden arrow': 'Nível de teste: seta dourada', 'Temporary. After 1 launch, two arrows block each other and one turns golden.': 'Temporário. Depois de 1 lançamento, duas setas bloqueiam-se e uma fica dourada.', 'Test level: play the arrow at the top to see the golden arrow.': 'Nível de teste: joga a seta de cima para veres a seta dourada.', 'Golden arrow': 'Seta dourada', 'Only appears if arrows truly block each other. It sparkles, hums and can fly through anything, so the board can always be cleared.': 'Só aparece quando há setas que se bloqueiam mesmo umas às outras. Brilha, faz um som especial e atravessa tudo, por isso o tabuleiro pode sempre ser limpo.', 'Music volume': 'Volume da música', 'Sound volume': 'Volume dos sons', 'The backgrounds will change with the music: when a song ends, the next scene fades in.': 'Os fundos mudam com a música: quando uma música acaba, o cenário seguinte aparece suavemente.', 'High Sun': 'Sol a Pino', 'Noon: sunny vibraphone and soft guitar': 'Meio-dia: vibrafone solarengo e guitarra suave', 'Next Theme': 'Tema seguinte', 'Co-op test: 4 boards': 'Teste cooperativo: 4 tabuleiros', 'Co-op room (preview)': 'Sala cooperativa (pré-visualização)', 'What the room host would see: players, code and settings.': 'O que o anfitrião da sala veria: jogadores, código e definições.', 'Tutorial: Sniper arrows': 'Tutorial: Setas sniper', 'Tutorial: Twin-shared arrows': 'Tutorial: Setas gémeas partilhadas', 'Two boards. You control both.': 'Dois tabuleiros. Controlas os dois.', 'Sniper arrows': 'Setas sniper', 'Twin-shared arrows': 'Setas gémeas partilhadas', 'The two middle arrows block each other. Only Ana\'s sniper arrow can break them free.': 'As duas setas do meio bloqueiam-se uma à outra. Só a seta sniper da Ana as consegue libertar.', 'The X+ arrow has a twin on Bruno\'s board. They leave together, so both paths must be clear.': 'A seta X+ tem uma gémea no tabuleiro do Bruno. Saem juntas, por isso os dois caminhos têm de estar livres.', 'Co-op test: clear both boards. Use the arrow at the edge to switch boards.': 'Teste cooperativo: limpa os dois tabuleiros. Usa a seta na margem para mudar de tabuleiro.', 'Nothing can mo
