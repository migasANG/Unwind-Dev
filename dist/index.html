<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Unwind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen sky. The board floats in it, arrows fly off the real screen edge, and a sun marks progress through the day. */
:root{
  --ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
#board{width:100%;height:100%;touch-action:manipulation;cursor:pointer;display:block}
.ui{position:fixed;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:color 2s ease}
.ui>*{pointer-events:auto}
header.ui{top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.place{min-width:0}
.place h1{margin:0;font:italic 500 clamp(1.7rem,6vw,2.1rem)/1 var(--display)}
.place p{margin:4px 0 0;font-size:.8125rem;letter-spacing:.02em;opacity:.8}
.right{display:flex;align-items:center;gap:14px;flex:none}
#lives{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#hearts{display:flex;gap:3px}
#hearts svg{width:21px;height:21px;fill:currentColor;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .5s ease}
#hearts svg.gone{fill:none;stroke:currentColor;stroke-width:1.6;opacity:.42;transform:scale(.82)}
#hearts svg.lost{animation:heartbreak .7s ease}
#livesLabel{font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums}
#timer{flex:none;font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
#timer.low{animation:breathe 1s ease-in-out infinite}
#timebar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:5px;width:100%;background:currentColor;transform-origin:left;opacity:.7}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.45)}100%{transform:scale(.82)}}
@keyframes breathe{50%{opacity:.5}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:8px}
#mute{width:40px;height:40px;display:grid;place-items:center;margin-right:-8px}
#mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
#caption{bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:center;font:italic 500 1.2rem/1.25 var(--display);text-wrap:balance;opacity:0;transition:opacity .8s ease}
#caption.on{opacity:1}
nav.ui{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,minmax(0,84px));justify-content:center;gap:4px}
nav button{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;font-weight:500;border-radius:14px;transition:opacity .3s ease,background .3s ease}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
nav button:disabled{opacity:.32;cursor:default;background:none}
nav button.call{background:color-mix(in srgb,currentColor 15%,transparent)}
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--sky-a) 45%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .6s ease both;z-index:5}
.card{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--card);border-radius:24px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text}
.card h2{margin:0;font:italic 500 2.25rem/1.05 var(--display);text-wrap:balance}
.card p{margin:0;line-height:1.5;font-size:.9375rem}
.primary{height:50px;border-radius:25px;background:var(--ink);color:var(--card);font-weight:600}
.secondary{height:44px;border-radius:22px;border:1.5px solid currentColor;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{width:40px;height:40px;font-size:1.5rem;line-height:1;margin:-8px -8px -8px 0}
.lv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.lv button{position:relative;aspect-ratio:1;border-radius:50%;font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid currentColor}
.lv .mk{position:absolute;width:16px;height:16px;top:-4px;stroke:var(--card);stroke-width:1.4;stroke-linejoin:round;paint-order:stroke}
.lv .mk.s{right:-3px;fill:#ffc21f}
.lv .mk.m{left:-3px;fill:#9fd8ff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;align-items:center;margin-top:-6px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:15px;height:15px;stroke:none}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border-radius:12px;background:color-mix(in srgb,currentColor 9%,transparent)}
.modes .openbox>button{border:0;padding:0;border-radius:0}
.modes .sizes button{border:0;padding:0;text-align:center;line-height:1}
.modes .switch{padding:0}
.modes .openbox>.primary{border-radius:25px;text-align:center;height:46px}
.sizes button{height:32px;border-radius:9px;font-weight:600;font-size:.8125rem}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
#zoomctl{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;z-index:2}
#zoomctl button{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:1.3rem;font-weight:500;line-height:1;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.25)}
#zoomctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
body.bigmap header.ui{background:var(--sky-a);padding-bottom:8px}
body.bigmap nav.ui{background:var(--sky-b);padding-top:6px}
body.bigmap #caption.on{left:12px;right:auto;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:max-content;max-width:44vw;padding:4px 14px;border-radius:14px;background:var(--card);font:600 .8125rem/1.3 var(--body)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:color-mix(in srgb,currentColor 9%,transparent)}
.tabs button{height:38px;border-radius:12px;font-weight:600;font-size:.875rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.note{font-size:.8125rem;opacity:.85;margin-top:-6px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500}
.switch{width:52px;height:30px;border-radius:15px;border:1.5px solid currentColor;position:relative;flex:none}
.switch::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:currentColor;top:3.5px;left:4px;transition:left .2s ease}
.switch[aria-checked="true"]{background:color-mix(in srgb,currentColor 18%,transparent)}
.switch[aria-checked="true"]::after{left:25px}
.theme{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 14px;border-radius:14px;border:1.5px solid color-mix(in srgb,currentColor 25%,transparent);text-align:left}
.theme[aria-pressed="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 11%,transparent)}
.theme b{font-weight:600}
.theme span{font-size:.8125rem;opacity:.8}
.win{gap:12px;padding:0 0 20px;overflow:auto}
.win>*:not(.scene){margin-left:20px;margin-right:20px}
.scene{display:block;width:100%;height:auto;flex:none;border-radius:24px 24px 0 0}
.verdict{text-align:center;margin-top:2px}
.win h2{font-size:2.6rem;text-align:center}
.win h2.gold{color:var(--gold-ink)}
.verdict p{margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;opacity:.8}
.winhearts{display:flex;justify-content:center;gap:4px}
.winhearts svg{width:24px;height:24px;fill:var(--heart);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.winhearts svg.gone{fill:none;stroke:currentColor;stroke-width:1.6;opacity:.35}
.lanterns{font-size:.8125rem;text-align:center;opacity:.9}
.lantern-bar{height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 14%,transparent);overflow:hidden;margin-top:5px}
.lantern-bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actions .secondary{font-size:.8125rem;padding:0 4px}
.actions .primary{grid-column:1/-1}
.openbox{display:grid;gap:10px;padding:11px 16px;border-radius:16px;border:1.5px solid currentColor}
.openbox>button{text-align:left;line-height:1.3;border:0;padding:0}
.openbox .setting{font-size:.875rem}
.openbox .setting span small{display:block;font-size:.75rem;font-weight:400;opacity:.8}
.now{font-size:.875rem;margin-top:-6px;opacity:.9}
.sheet.side{justify-content:flex-start;align-items:stretch;padding:0}
.sheet.side .card{height:100%;max-width:350px;width:90vw;border-radius:0 24px 24px 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:18px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:slidein .32s cubic-bezier(.2,.8,.3,1) both;gap:14px}
.sheet.side h2{font-size:1.9rem}
.guide-item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start}
.guide-item svg{width:62px;height:46px;display:block;fill:none;stroke-linecap:round;stroke-linejoin:round}
.guide-item h3{margin:0;font-size:.9375rem;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.guide-item p{margin:2px 0 0;font-size:.8125rem;line-height:1.4}
.onboard{font-size:.6875rem;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--ink);color:var(--card)}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
.smoke{animation:smoke 5s ease-in infinite}
.smoke.b{animation-delay:1.6s}.smoke.c{animation-delay:3.2s}
.boat{animation:bob 4.6s ease-in-out infinite}
.rise{animation:rise 6s ease-in infinite}
.fly{animation:fly 3.4s ease-in-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translate(9px,-30px) scale(1.5);opacity:0}}
@keyframes bob{50%{transform:translateY(2px) rotate(1.2deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:.9}100%{transform:translateY(-105px);opacity:0}}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(8px,-7px);opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.lv button.done{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lv button:disabled{opacity:.28;cursor:default}
.chapter{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:-8px}
.modes{display:grid;gap:8px}
.modes button{text-align:left;padding:11px 16px;border-radius:16px;border:1.5px solid currentColor;line-height:1.3}
.modes b{display:block;font-weight:600}
.modes span{font-size:.8125rem;opacity:.8}
#debug pre{margin:0;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:36vh;white-space:pre}
#debug table{border-collapse:collapse;font-size:.8125rem;font-variant-numeric:tabular-nums;width:100%}
#debug td,#debug th{text-align:right;padding:2px 6px;border-bottom:1px solid color-mix(in srgb,currentColor 20%,transparent)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#sky,#sky2,#sun,.sheet,.smoke,.boat,.rise,.fly,#timer.low,#hearts svg.lost,.winhearts svg,.sheet.side .card{transition:none;animation:none}.rise,.smoke{display:none}}
</style>

<script>// Unwind game rules. No DOM access, so the same file runs in the browser and in Node tests.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.UnwindEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  // Directions run clockwise: 0 up, 1 right, 2 down, 3 left.
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  function rng32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(list, r) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1)), t = list[i];
      list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  // Builds the cell lookup used by every rule check.
  function prepare(level) {
    var grid = new Array(level.w * level.h).fill(-1);
    level.arrows.forEach(function (a) {
      a.cells.forEach(function (c) { grid[c[1] * level.w + c[0]] = a.id; });
    });
    level.grid = grid;
    level.mirrorAt = {};
    (level.mirrors || []).forEach(function (m) { level.mirrorAt[m.y * level.w + m.x] = m.t; });
    return level;
  }
  function newState(level) {
    return {
      removed: level.arrows.map(function () { return false; }),
      launches: 0,
      lives: level.lives === null ? null : (level.lives || 3),
      history: []
    };
  }
  function headOf(a) { return a.cells[a.cells.length - 1]; }
  function dirOf(a, state) { return a.kind === 'compass' ? (a.dir + state.launches) % 4 : a.dir; }
  function partnerOf(a) { return a.kind === 'twin' ? a.twin : -1; }

  // A mirror turns a travelling arrow 90 degrees. Index by direction of travel.
  var TURN = { '/': [1, 0, 3, 2], '\\': [3, 2, 1, 0] };

  // Walks from the head to the board edge, following mirrors. The arrow's own cells and its twin never block it.
  // path holds every corner, for drawing; endDir is the direction it finally leaves in.
  function check(level, state, a) {
    var d = dirOf(a, state), h = headOf(a), x = h[0], y = h[1], dist = 0, partner = partnerOf(a), path = [], guard = 0;
    for (;;) {
      x += DX[d]; y += DY[d]; dist++;
      if (x < 0 || y < 0 || x >= level.w || y >= level.h) return { clear: true, dist: dist, dir: dirOf(a, state), endDir: d, path: path };
      if (++guard > 400) return { clear: false, blocker: a.id, dist: 1, dir: dirOf(a, state), endDir: d, path: [] };
      var mirror = level.mirrorAt && level.mirrorAt[y * level.w + x];
      if (mirror) { d = TURN[mirror][d]; path.push([x, y]); continue; }
      var o = level.grid[y * level.w + x];
      if (o !== -1 && o !== a.id && o !== partner && !state.removed[o]) return { clear: false, blocker: o, dist: dist, dir: dirOf(a, state), endDir: d, path: path };
    }
  }
  // Sleepers wait for their key arrow to leave. Patient arrows wait for a number of launches.
  function isReady(state, a) {
    if (a.key !== undefined && !state.removed[a.key]) return false;
    if (a.wait && state.launches < a.wait) return false;
    return true;
  }
  function group(level, a) {
    return a.kind === 'twin' ? [a, level.arrows[a.twin]] : [a];
  }
  function canLaunch(level, state, id) {
    return group(level, level.arrows[id]).every(function (m) { return isReady(state, m) && check(level, state, m).clear; });
  }

  // A tap: launches the arrow when clear, otherwise reports the collision and costs a life.
  function tap(level, state, id) {
    var members = group(level, level.arrows[id]);
    // Tapping an arrow that is not ready yet is free: nothing moves and no life is lost.
    if (!members.every(function (m) { return isReady(state, m); })) return { ok: false, notReady: true, results: [], failed: false };
    var results = members.map(function (m) { return { id: m.id, check: check(level, state, m) }; });
    var hit = results.filter(function (r) { return !r.check.clear; });
    if (hit.length) {
      if (state.lives !== null) state.lives--;
      return { ok: false, results: results, failed: state.lives === 0 };
    }
    members.forEach(function (m) { state.removed[m.id] = true; });
    state.history.push(members.map(function (m) { return m.id; }));
    state.launches++;
    return { ok: true, results: results, won: state.removed.every(Boolean) };
  }
  // Rewind restores the last launch. Lives stay as they are.
  function rewind(state) {
    var last = state.history.pop();
    if (!last) return null;
    last.forEach(function (id) { state.removed[id] = false; });
    state.launches--;
    return last;
  }
  function legalMoves(level, state) {
    var out = [];
    level.arrows.forEach(function (a) {
      if (state.removed[a.id]) return;
      if (a.kind === 'twin' && a.twin < a.id) return;
      if (canLaunch(level, state, a.id)) out.push(a.id);

  function isStuck(level, state) { return !isWon(state) && legalMoves(level, state).length === 0; }

  // Depth-first search with memoised dead ends.
  function solve(level, from, budget) {
    var state = { removed: from.removed.slice(), launches: from.launches, lives: null, history: [] };
    var dead = {}, nodes = 0, limit = budget || 200000, exhausted = false, path = [];
    function dfs() {
      if (isWon(state)) return true;
      var key = state.removed.map(Number).join('');

      if (++nodes > limit) { exhausted = true; return false; }
      var moves = legalMoves(level, state);
      for (var i = 0; i < moves.length; i++) {
        var members = group(level, level.arrows[moves[i]]);
        members.forEach(function (m) { state.removed[m.id] = true; });
        state.launches++; path.push(moves[i]);

    var s = sheet('<h2>' + (timeUp ? "Time's up" : 'Out of lives') + '</h2><p>' + (timeUp ? 'The board was nearly there. Take a breath and go again.' : 'Take a moment, then try this board again.') + '</p><button class="primary" id="again">Try again</button><button class="secondary" id="toLevels">Choose another level</button>');
    s.querySelector('#again').onclick = function () { restart(); };
    s.querySelector('#toLevels').onclick = function () { levelsSheet(c.set || 'calm'); };
  }
  var STAR_PATH = '<path d="M12 2.500l2.900 6.100 6.600.900-4.800 4.600 1.200 6.600-5.900-3.200-5.900 3.200 1.200-6.600L2.500 9.500l6.600-.900Z"/>';
  var MOON_PATH = '<path d="M11.500 3.200a9 9 0 1 0 9.300 12.600A7.800 7.800 0 0 1 11.500 3.200Z"/><path d="M18 3l.9 2 2.100.300-1.500 1.500.4 2.100-1.900-1-1.900 1 .4-2.100L15 5.300l2.100-.300Z"/>';
  var STAR_MARK = '<svg class="mk s" viewBox="0 0 24 24" aria-hidden="true">' + STAR_PATH + '</svg>';
  var MOON_MARK = '<svg class="mk m" viewBox="0 0 24 24" aria-hidden="true">' + MOON_PATH + '</svg>';
  var CALM_SECTIONS = [['First steps', 0, 6], ['Twins', 6, 9], ['Compass', 9, 12], ['Sleepers', 12, 15], ['Mirrors', 15, 18], ['Patient', 18, 21], ['Everything together', 21, 24]];
  function levelsSheet(tab) {
    tab = tab || (current && current.set) || 'calm';
    var html = '<div class="row"><h2>A day on the lake</h2><button class="close" id="x" aria-label="Close">×</button></div>';
    html += '<div class="tabs" role="tablist">' + Object.keys(SET_INFO).map(function (k) { return '<button role="tab" aria-selected="' + (k === tab) + '" data-tab="' + k + '">' + SET_INFO[k].label + '</button>'; }).join('') + '</div>';
    var grid = function (from, to) {
      var out = '<div class="lv">';
      for (var i = from; i < to; i++) {
        var id = SET_INFO[tab].prefix + (i + 1);
        out += '<button data-l="' + i + '" class="' + (progress.done[id] ? 'done ' : '') + (progress.perfect[id] ? 'perfect' : '') + '" aria-label="Level ' + (i + 1) + (progress.perfect[id] ? ', perfect' : progress.done[id] ? ', cleared' : '') + '">' + (i + 1) + (progress.done[id] ? MOON_MARK : '') + (progress.perfect[id] ? STAR_MARK : '') + '</button>';
      }
      return out + '</div>';
    };
    html += '<div class="legend"><span>' + MOON_MARK.replace('class="mk m"', 'fill="#9fd8ff"') + 'Completed</span><span>' + STAR_MARK.replace('class="mk s"', 'fill="#ffc21f"') + 'Perfect, no lives lost</span></div>';
    if (tab === 'calm') CALM_SECTIONS.forEach(function (sec) { html += '<div class="chapter">' + sec[0] + '</div>' + grid(sec[1], sec[2]); });
    else {
      html += '<p class="note">' + (tab === 'hard' ? 'Bigger boards. Two lives and no hints.' : 'Beat the clock on every board. Three lives.') + '</p>' + grid(0, SETS[tab].length);
    }
    html += '<div class="modes"><button id="mDaily"><b>Today\'s puzzle</b><span>' + (progress.daily === todayKey() ? 'Cleared today. Play it again any time.' : 'One new board each day.') + '</span></button><div class="openbox"><button id="mOpen"><b>Open water</b><span>' + openLabel() + '</span></button>' +
      '<div class="setting"><span id="lHard">Harder<small>Bigger boards, 2 lives, no hints</small></span><button class="switch" id="oHard" role="switch" aria-labelledby="lHard" aria-checked="' + !!endlessOpts().hard + '"></button></div>' +
      '<div class="setting"><span id="lTimed">Timed<small>Clear each board before the clock runs out</small></span><button class="switch" id="oTimed" role="switch" aria-labelledby="lTimed" aria-checked="' + !!endlessOpts().timed + '"></button></div>' +
      '<div class="setting"><span>Map size<small>Bigger maps can be zoomed and moved around</small></span></div><div class="sizes" role="group" aria-label="Map size">' + [1, 3, 5, 10].map(function (x) { return '<button data-scale="' + x + '" aria-pressed="' + ((endlessOpts().scale || 1) === x) + '">' + (x === 1 ? 'Normal' : x + 'x') + '</button>'; }).join('') + '</div><button class="primary" id="mGo">Play open water</button></div></div>';
    html += '<p class="note" style="margin:0;text-align:center">© 2026 Miguel. All rights reserved.</p>';
    var s = sheet(html);
    s.querySelector('#x').onclick = closeSheet;
    s.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { levelsSheet(b.getAttribute('data-tab')); }; });
    s.querySelectorAll('[data-l]').forEach(function (b) { b.onclick = function () { openLevel(tab, +b.getAttribute('data-l')); }; });
    s.querySelector('#mDaily').onclick = openDaily;
    s.querySelector('#mOpen').onclick = openEndless;
    s.querySelector('#mGo').onclick = openEndless;
    [['#oHard', 'hard'], ['#oTimed', 'timed']].forEach(function (pair) {
      s.querySelector(pair[0]).onclick = function () {
        var o = endlessOpts(); o[pair[1]] = !o[pair[1]]; progress.endlessOpts = o; save('unwind.progress2', progress);
        this.setAttribute('aria-checked', o[pair[1]]);
        s.querySelector('#mOpen span').textContent = openLabel();
      };
    });
    s.querySelectorAll('[data-scale]').forEach(function (b) {
      b.onclick = function () {
        var o = endlessOpts(); o.scale = +b.getAttribute('data-scale'); progress.endlessOpts = o; save('unwind.progress2', progress);
        s.querySelectorAll('[data-scale]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        s.querySelector('#mOpen span').textContent = openLabel();
      };
    });
  }
  function openLabel() {
    var o = endlessOpts(), size = (o.scale || 1) > 1 ? o.scale + 'x maps' : 'Endless boards';
    if (o.hard && o.timed) return size + ', harder and timed.';
    if (o.hard) return size + ', harder.';
    if (o.timed) return size + ' against the clock.';
    return (o.scale || 1) > 1 ? size + ' with no lives to lose.' : 'Endless boards with no lives to lose.';
  }
  // A side menu explaining every arrow, drawn in the colours they have on the board.
  function guideSheet() {
    var ink = colors.ink, twin = colors.twins[0], comp = colors.compass, mir = colors.mirror, gold = '#ffd23f', disc = '#1d2350', card = colors.card;
    var head = function (x, y, c) { return '<path d="M' + (x - 7) + ' ' + (y - 7) + ' L' + x + ' ' + y + ' L' + (x - 7) + ' ' + (y + 7) + '" stroke="' + c + '" stroke-width="4.5"/>'; };
    var badge = function (x, y, fill, text, label, edge) { return '<circle cx="' + x + '" cy="' + y + '" r="10" fill="' + fill + '"' + (edge ? ' stroke="' + edge + '" stroke-width="2"' : '') + '/><text x="' + x + '" y="' + (y + 4.500) + '" text-anchor="middle" font-size="13" font-weight="600" fill="' + text + '" stroke="none">' + label + '</text>'; };
    var nightDisc = function (x, y) { return '<circle cx="' + x + '" cy="' + y + '" r="11" fill="' + disc + '" stroke="' + gold + '" stroke-width="2"/>'; };
    var line = function (d, c, dash) { return '<path d="' + d + '" stroke="' + c + '" stroke-width="4.500"' + (dash ? ' stroke-dasharray="6 7"' : '') + '/>'; };
    var moon = '<path d="M16 16.500a7 7 0 1 0 5.500 11A6 6 0 0 1 16 16.500Z" fill="' + gold + '"/>';
    var star = '<path d="M14 15.500l2.100 4.500 4.900.600-3.600 3.400.9 4.900-4.300-2.400-4.300 2.400.9-4.900L7 20.600l4.900-.600Z" fill="' + gold + '"/>';
    var items = [
      { key: 'plain', title: 'Arrow', text: 'Tap it to send it off the board. If something is in its way, it bounces back and costs a life.',
        art: line('M6 36H26V12H50', ink) + head(55, 12, ink) },
      { key: 'twin', title: 'Twins', text: 'Same colour and letter. They leave together, so both of their paths must be clear.',
        art: line('M4 12H46', twin) + head(52, 12, twin) + badge(24, 12, twin, card, 'A') + line('M4 36H46', twin) + head(52, 36, twin) + badge(24, 36, twin, card, 'A') },
      { key: 'compass', title: 'Compass', text: 'Turns a quarter clockwise each time an arrow leaves. The wrong order can leave you stuck, so use Rewind.',
        art: '<circle cx="31" cy="23" r="19" stroke="' + comp + '" stroke-width="2.500"/>' + line('M21 23H38', comp) + head(44, 23, comp) },
      { key: 'moon', title: 'Moon arrow', text: 'Asleep and dashed. It cannot move until its star arrow leaves. Tapping it early costs nothing.',
        art: line('M16 23H50', ink, true) + head(56, 23, ink) + nightDisc(14, 23) + moon },
      { key: 'star', title: 'Star arrow', text: 'When it leaves, it wakes the moon arrow at the other end of its golden thread.',
        art: line('M16 23H50', ink) + head(56, 23, ink) + nightDisc(14, 23) + star },
      { key: 'mirror', title: 'Mirror', text: 'Not an arrow. It turns any arrow passing through by 90 degrees, so follow the new path.',
        art: '<circle cx="31" cy="23" r="19" stroke="' + mir + '" stroke-width="1.500" opacity=".6"/>' + line('M18 36L44 10', mir) },
      { key: 'patient', title: 'Patient arrow', text: 'Its number shows how many more launches it needs before it can leave. Tapping it early costs nothing.',
        art: line('M4 23H50', ink, true) + head(56, 23, ink) + badge(28, 23, card, ink, '3', ink) }
    ];
    var here = {}, arrows = current.level.arrows;
    arrows.forEach(function (a) {
      if (a.kind === 'twin') here.twin = 1; else if (a.kind === 'compass') here.compass = 1; else here.plain = 1;
      if (a.key !== undefined) here.moon = 1; if (a.isKey) here.star = 1; if (a.wait) here.patient = 1;
    });
    if ((current.level.mirrors || []).length) here.mirror = 1;
    var html = '<div class="row"><h2>Arrow guide</h2><button class="close" id="x" aria-label="Close">×</button></div>' +
      items.map(function (it) {
        return '<div class="guide-item"><svg viewBox="0 0 62 46" aria-hidden="true">' + it.art + '</svg><div><h3>' + it.title + (here[it.key] ? '<span class="onboard">On this board</span>' : '') + '</h3><p>' + it.text + '</p></div></div>';
      }).join('');
    var s = sheet(html);
    s.classList.add('side');
    s.querySelector('#x').onclick = closeSheet;
    s.onclick = function (ev) { if (ev.target === s) closeSheet(); };
    track('guide_open', {});
  }
  function restart() {
    track('restart', { launches: state.launches });
    begin(current);
  }
  function settingsSheet() {
    var themeRow = function (id, name, mood) { return '<button class="theme" data-theme-id="' + id + '" aria-pressed="' + (audioPrefs.theme === id) + '"><b>' + name + '</b><span>' + mood + '</span></button>'; };
    var html = '<div class="row"><h2>Music and sound</h2><button class="close" id="x" aria-label="Close">×</button></div>' +
      '<div class="setting"><span id="lMusic">Music</span><button class="switch" id="sMusic" role="switch" aria-labelledby="lMusic" aria-checked="' + audioPrefs.music + '"></button></div>' +
      '<div class="setting"><span id="lSound">Sound effects</span><button class="switch" id="sSound" role="switch" aria-labelledby="lSound" aria-checked="' + audioPrefs.sound + '"></button></div>' +
      '<div class="chapter" style="margin-bottom:-6px">Theme</div><p class="now" id="nowPlaying"></p><div class="modes">' + themeRow('auto', 'Follow the day', 'Changes with the time of day') + M.THEMES.map(function (t) { return themeRow(t.id, t.name, t.mood); }).join('') + '</div>';
    var s = sheet(html);
    var showNow = function () { s.querySelector('#nowPlaying').textContent = audioPrefs.music ? 'Now playing: ' + M.THEMES[wantedTheme()].name : 'Music is off'; };
    showNow();
    s.querySelector('#x').onclick = closeSheet;
    s.querySelector('#sMusic').onclick = function () {
      audioPrefs.music = !audioPrefs.music; save('unwind.audio', audioPrefs);
      audio();
      if (musicBus && ac) { musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(audioPrefs.music ? 0.8 : 0, ac.currentTime, 0.2); }
      this.setAttribute('aria-checked', audioPrefs.music); refresh(); showNow(); musicTick();
    };
    s.querySelector('#sSound').onclick = function () {
      audioPrefs.sound = !audioPrefs.sound; save('unwind.audio', audioPrefs);
      audio();
      if (sfxBus && ac) sfxBus.gain.setTargetAtTime(audioPrefs.sound ? 0.75 : 0, ac.currentTime, 0.05);
      this.setAttribute('aria-checked', audioPrefs.sound); refresh();
    };
    s.querySelectorAll('[data-theme-id]').forEach(function (b) {
      b.onclick = function () {
        audioPrefs.theme = b.getAttribute('data-theme-id'); save('unwind.audio', audioPrefs);
        s.querySelectorAll('[data-theme-id]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        // Choosing a theme also turns the music back on.
        if (!audioPrefs.music) {
          audioPrefs.music = true; save('unwind.audio', audioPrefs);
          s.querySelector('#sMusic').setAttribute('aria-checked', true);
          audio();
          if (musicBus && ac) { musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0.8, ac.currentTime, 0.2); }
          refresh();
        }
        audio(); stopJingle(); duck(false); musicTick(); showNow();
      };
    });
  }

  /* ---------- Toolbar ---------- */
  $('bRewind').onclick = function () {
    audio();
    var ids = E.rewind(state);
    if (!ids) return;
    current.level.arrows.forEach(function (x) { if (x.kind === 'compass' && !state.removed[x.id] && ids.indexOf(x.id) < 0) angles[x.id] -= 90; });
    ids.forEach(function (id) { var a = current.level.arrows[id]; if (a.kind === 'compass') { angles[id] = E.dirOf(a, state) * 90; a.vis = angles[id]; } });
    tune.pop(); rewinds++; wakes = [];
    pluck(146.8, 0, 0.12, 0.7);
    track('rewind', { launches: state.launches });
    hintArrow = -1; refresh();
  };
  $('bHint').onclick = function () {
    audio();
    var l = current.level, sol = E.solve(l, state, l.big ? 6000 : 80000);
    if (sol.solved && sol.sequence.length) {
      hintArrow = sol.sequence[0]; hintStart = performance.now(); hintsLeft--; hintsUsed++;
      track('hint_used', {});
      pluck(M.hz(M.THEMES[wantedTheme()].pent[7]), 0, 0.12, 1);
    } else if (!sol.exhausted) {
      setCaption('This board cannot clear from here. Rewind a step or two.');
    } else {
      var m = E.legalMoves(l, state);
      if (m.length) { hintArrow = m[0]; hintStart = performance.now(); hintsLeft--; hintsUsed++; track('hint_used', { fallback: true }); }
    }
    if (hintArrow >= 0) focusArrow(hintArrow);
    refresh();
    if (!sol.solved && !sol.exhausted) $('bRewind').classList.add('call');
  };
  $('bRestart').onclick = function () { audio(); restart(); };
  $('bGuide').onclick = function () { audio(); guideSheet(); };
  $('bLevels').onclick = function () { audio(); levelsSheet(); };
  $('mute').onclick = function () { audio(); settingsSheet(); };

  /* ---------- Hidden analytics view: add #debug or ?debug=1 to the address ---------- */
  function debugSheet() {
    var rows = {};
    events.forEach(function (e) {
      if (!e.level) return;
      var r = rows[e.level] = rows[e.level] || { start: 0, clear: 0, fail: 0, hit: 0, hint: 0, stuck: 0 };
      if (e.e === 'level_start') r.start++; if (e.e === 'level_complete') r.clear++; if (e.e === 'level_fail') r.fail++;
      if (e.e === 'collision') r.hit++; if (e.e === 'hint_used') r.hint++; if (e.e === 'stuck') r.stuck++;
    });
    var table = '<table><tr><th>Level</th><th>Starts</th><th>Clears</th><th>Fails</th><th>Hits</th><th>Hints</th><th>Stuck</th></tr>' + Object.keys(rows).map(function (k) {
      var r = rows[k]; return '<tr><td>' + k + '</td><td>' + r.start + '</td><td>' + r.clear + '</td><td>' + r.fail + '</td><td>' + r.hit + '</td><td>' + r.hint + '</td><td>' + r.stuck + '</td></tr>';
    }).join('') + '</table>';
    var recent = events.slice(-40).reverse().map(function (e) { return JSON.stringify(e); }).join('\n');
    var s = sheet('<div id="debug" style="display:grid;gap:14px"><div class="row"><h2>Analytics</h2><button class="close" id="x" aria-label="Close">×</button></div><p>Stored in this browser only.</p>' + '<div style="overflow-x:auto">' + table + '</div><pre></pre><button class="secondary" id="wipe">Clear events and progress</button></div>');
    s.querySelector('pre').textContent = recent;
    s.querySelector('#x').onclick = closeSheet;
    s.querySelector('#wipe').onclick = function () {
      events = []; progress = { last: { set: 'calm', index: 0 }, done: {}, perfect: {}, best: {}, endlessBy: {}, endlessOpts: { hard: false, timed: false }, daily: null };
      save('unwind.events', events); save('unwind.progress2', progress); openLevel('calm', 0);
    };
  }

  window.addEventListener('resize', function () { layout(); });
  window.addEventListener('hashchange', function () { if (location.hash === '#debug') debugSheet(); });
  /*TEST-HOOK-START*/
  // Small test hook: reports where to tap on screen, and jumps between boards.
  window.unwindTest = {
    point: function (id) {
      var c = current.level.arrows[id].cells[0];
      if (cam) { cam.anim = null; cam.zoom = null; cam.cx = c[0] + 0.5; cam.cy = c[1] + 0.5; applyCam(); }
      return px(c);
    },
    solve: function () { return current.level.solution && !state.launches ? current.level.solution : E.solve(current.level, state, 800000).sequence; },
    cam: function () { return cam && { zooming: !!cam.zoom, cs: cs, cx: cam.cx, cy: cam.cy, fit: fitCs, w: current.level.w, h: current.level.h, n: current.level.arrows.length }; },
    snapshot: function () { return { id: current.id, launches: state.launches, lives: state.lives, won: E.isWon(state), stuck: E.isStuck(current.level, state), hint: hintArrow, timeLeft: timeLeft, sheet: !!$('sheetHost').firstChild }; },
    arrows: function () { return current.level.arrows; },
    open: function (set, i) { openLevel(set, i); },
    setTime: function (ms) { timeLeft = ms; },
    counts: function () { return { calm: SETS.calm.length, hard: SETS.hard.length, timed: SETS.timed.length }; },
    legal: function () { return E.legalMoves(current.level, state); },
    music: M,
    audio: function () {
      var rms = 0;
      if (analyser) { var d = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(d); d.forEach(function (v) { rms += v * v; }); rms = Math.sqrt(rms / d.length); }
      return { state: ac && ac.state, playing: playingTheme >= 0 ? M.THEMES[playingTheme].name : null, rms: rms, duck: duckBus ? duckBus.gain.value : null, jingle: !!jingleBus };
    },
    noteFor: noteFor,
    hintAge: function () { return performance.now() - hintStart; },
    hintAmt: function () { return lastHintAmt; },
    win: function () { return null; }
  };

  /*TEST-HOOK-END*/
  track('session_start', {});
  var last = progress.last || { set: 'calm', index: 0 };
  openLevel(SETS[last.set] ? last.set : 'calm', Math.min(last.index || 0, (SETS[last.set] || SETS.calm).length - 1));
  requestAnimationFrame(frame);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(document.body);
  if (location.hash === '#debug' || /[?&]debug=1/.test(location.search)) debugSheet();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
