/* Layout: one full-screen sky. The board floats in it, arrows fly off the real screen edge, and a sun marks progress through the day. */
:root{
  --ink:#3d2f5b; --twin:#c2476d; --compass:#17707f; --sun:#ffe9c7; --sky-a:#f6d9cf; --sky-b:#c9c6e6; --card:#fff6f0; --gold:#f0a92a; --gold-ink:#a86a00; --heart:#d23d5e;
  --display:"Fredoka","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky-a);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#sky,#sky2,#sun,#board{position:fixed;inset:0}
#sky,#sky2{transition:opacity 2.4s ease}
#sky2{opacity:0}
#sun{inset:auto;left:50%;width:min(92vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);top:var(--sun-y,70%);background:var(--sun);opacity:.55;filter:blur(2px);transition:top 2.6s cubic-bezier(.3,.1,.2,1),background 2.4s ease}
.scenebg{position:fixed;inset:0;overflow:hidden}
.scenebg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenebg.baking *{animation:none!important}
.scenebg svg.mover{will-change:transform,opacity}
.scenebg.pending{opacity:.001;pointer-events:none}
.scenebg{transition:opacity var(--bgfade,1.4s) ease-in-out;will-change:opacity}
.boardfade{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity var(--bgfade,1.4s) ease-in-out}
